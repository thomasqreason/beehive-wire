<script>
/* Crosshair for every chart: date, O/H/L/C, change, volume vs the 50-day average, 14-day ATR.
   Mouse: hover. Touch: press and hold ~300ms, then drag; the page scrolls normally otherwise.
   Pop-up charts get their data directly; article charts fetch series/SYM.json on first touch. */
window.BWXH=(function(){
  var PL=8,PR=62,PT=10,PH=290,VT=318,VH=90,cache={};
  function wOf(svg){try{var vb=svg.viewBox.baseVal;if(vb&&vb.width)return vb.width;}catch(e){}return 760;}
  function f2(x){return x==null?'–':Number(x).toFixed(2);}
  function vol(v){return v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':String(v);}
  function atr(s,i,n){var tr=[];for(var k=Math.max(1,i-n+1);k<=i;k++){var h=s.h[k],l=s.l[k],pc=s.c[k-1];tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}return tr.length?tr.reduce(function(a,b){return a+b;},0)/tr.length:null;}
  function build(svg){
    var ns='http://www.w3.org/2000/svg',g=document.createElementNS(ns,'g');g.setAttribute('class','xh');g.style.pointerEvents='none';g.style.display='none';
    var vl=document.createElementNS(ns,'line'),hl=document.createElementNS(ns,'line'),dot=document.createElementNS(ns,'circle'),box=document.createElementNS(ns,'rect'),t1=document.createElementNS(ns,'text'),t2=document.createElementNS(ns,'text'),t3=document.createElementNS(ns,'text');
    dot.setAttribute('r','3');box.setAttribute('class','box');box.setAttribute('rx','3');
    g.appendChild(vl);g.appendChild(hl);g.appendChild(dot);g.appendChild(box);g.appendChild(t1);g.appendChild(t2);g.appendChild(t3);svg.appendChild(g);
    return {g:g,vl:vl,hl:hl,dot:dot,box:box,t1:t1,t2:t2,t3:t3};
  }
  function span(t,cls){var e=document.createElementNS('http://www.w3.org/2000/svg','tspan');if(cls)e.setAttribute('class',cls);e.textContent=t;return e;}
  function render(svg,s,el,px,py){
    var W=wOf(svg),n=s.c.length,i=Math.max(0,Math.min(n-1,Math.floor((px-PL)/((W-PL-PR)/n))));
    var lo=Math.min.apply(null,s.l),hi=Math.max.apply(null,s.h);
    var bm=svg.getAttribute('data-buymax');if(bm)hi=Math.max(hi,+bm);
    var pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad;
    var x=PL+(i+0.5)*(W-PL-PR)/n,yc=PT+(hi-s.c[i])/(hi-lo)*PH;
    el.vl.setAttribute('x1',x);el.vl.setAttribute('x2',x);el.vl.setAttribute('y1',PT);el.vl.setAttribute('y2',VT+VH);
    var yh=Math.max(PT,Math.min(PT+PH,py));el.hl.setAttribute('x1',PL);el.hl.setAttribute('x2',W-PR);el.hl.setAttribute('y1',yh);el.hl.setAttribute('y2',yh);
    el.dot.setAttribute('cx',x);el.dot.setAttribute('cy',yc);
    var chg=i?(s.c[i]/s.c[i-1]-1)*100:0,up=chg>=0,avg=s.avgv50||0,vr=avg?s.v[i]/avg:null,a=atr(s,i,14);
    var raw=s.d[i],d=new Date(raw.slice(0,10)+'T12:00:00'),ds=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    if(raw.length>10){var hh=parseInt(raw.slice(11,13),10),mm=raw.slice(14,16);ds=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' '+((hh+11)%12+1)+':'+mm+(hh<12?' AM':' PM');}
    [el.t1,el.t2,el.t3].forEach(function(t){while(t.firstChild)t.removeChild(t.firstChild);});
    var narrow=W<560,ohlc=narrow?el.t2:el.t1,tail=narrow?el.t3:el.t2;
    el.t1.appendChild(span(ds+'   '));
    if(narrow)el.t1.appendChild(span((up?'+':'')+chg.toFixed(1)+'%',up?'pos':'neg'));
    ohlc.appendChild(span('O ','k'));ohlc.appendChild(span(f2(s.o[i])+'  '));ohlc.appendChild(span('H ','k'));ohlc.appendChild(span(f2(s.h[i])+'  '));ohlc.appendChild(span('L ','k'));ohlc.appendChild(span(f2(s.l[i])+'  '));ohlc.appendChild(span('C ','k'));ohlc.appendChild(span(f2(s.c[i])+'  '));
    if(!narrow)ohlc.appendChild(span((up?'+':'')+chg.toFixed(1)+'%',up?'pos':'neg'));
    tail.appendChild(span('VOL ','k'));tail.appendChild(span(vol(s.v[i])+(vr!=null?'  ('+vr.toFixed(1)+'x avg)':'')+'   '));
    if(a!=null&&!narrow){tail.appendChild(span('ATR14 ','k'));tail.appendChild(span(f2(a)+'  ('+(a/s.c[i]*100).toFixed(1)+'%)   '));}
    tail.appendChild(span(narrow?'AT CURSOR ':'PRICE AT CURSOR ','k'));tail.appendChild(span(f2(hi-(yh-PT)/PH*(hi-lo))));
    var bwid=narrow?Math.min(250,W-PL-PR-12):440,bh=narrow?56:40,left=px>W/2,bx=left?PL+6:W-PR-6-bwid,by=PT+18;
    el.box.setAttribute('x',bx);el.box.setAttribute('y',by);el.box.setAttribute('width',bwid);el.box.setAttribute('height',bh);
    el.t1.setAttribute('x',bx+8);el.t1.setAttribute('y',by+15);el.t2.setAttribute('x',bx+8);el.t2.setAttribute('y',by+32);el.t3.setAttribute('x',bx+8);el.t3.setAttribute('y',by+49);el.t3.style.display=narrow?'':'none';
    el.g.style.display='';
  }
  function pt(svg,e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var m=svg.getScreenCTM();if(!m)return null;var q=p.matrixTransform(m.inverse());return {x:q.x,y:q.y};}
  function attach(svg,series){
    if(svg.__xh)return;svg.__xh=true;
    var el=build(svg),s=series,armed=false,timer=null,pid=null;
    function data(cb){if(s)return cb(s);var sym=svg.getAttribute('data-sym');if(!sym)return;if(cache[sym]){s=cache[sym];return cb(s);}
      fetch('series/'+encodeURIComponent(sym)+'.json').then(function(r){return r.ok?r.json():null;}).then(function(d){if(d&&d.series){s=cache[sym]=d.series;if(d.base&&d.base.buy_max)svg.setAttribute('data-buymax',d.base.buy_max);cb(s);}}).catch(function(){});}
    function move(e){var p=pt(svg,e);if(!p)return;data(function(ss){render(svg,ss,el,p.x,p.y);});}
    function off(){el.g.style.display='none';armed=false;if(timer){clearTimeout(timer);timer=null;}}
    svg.addEventListener('pointerenter',function(e){if(e.pointerType!=='touch')data(function(){});});
    svg.addEventListener('pointermove',function(e){if(e.pointerType==='touch'){if(armed){e.preventDefault();move(e);}return;}move(e);});
    svg.addEventListener('pointerleave',off);
    svg.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;pid=e.pointerId;var sx=e.clientX,sy=e.clientY;timer=setTimeout(function(){armed=true;try{svg.setPointerCapture(pid);}catch(x){}if(navigator.vibrate)navigator.vibrate(8);move(e);},300);
      var cancel=function(ev){if(!armed&&(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy)>10)){clearTimeout(timer);timer=null;svg.removeEventListener('pointermove',cancel);}};svg.addEventListener('pointermove',cancel);});
    svg.addEventListener('pointerup',function(e){if(e.pointerType==='touch'){off();}});
    svg.addEventListener('pointercancel',off);
    svg.addEventListener('touchmove',function(e){if(armed)e.preventDefault();},{passive:false});
  }
  document.querySelectorAll('svg.chart[data-sym]').forEach(function(sv){attach(sv,null);});
  return {attach:attach};
})();
</script>
