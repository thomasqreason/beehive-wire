<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site_name }} &middot; Welcome to the Market Desk</title>
<meta name="robots" content="noindex">
<link rel="icon" href="{{ root }}favicon-32.png" sizes="32x32">
<style>
  :root{color-scheme:light} html,body{margin:0;background:#fff;color:#000}
  body{font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45}
  .wrap{max-width:520px;margin:0 auto;padding:40px 18px 60px}
  .mast{text-align:center;border-bottom:4px double #000;padding:14px 0 10px;margin-bottom:28px}
  .mast h1{margin:0;font:900 34px/1 "Arial Black",Impact,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .mast h1 a{color:#000;text-decoration:none}
  .mast .desk{font:bold 12px/1.4 "Courier New",Courier,monospace;letter-spacing:.26em;text-transform:uppercase;margin-top:8px}
  h2{font:900 20px/1.2 Arial,Helvetica,sans-serif;text-transform:uppercase;margin:0 0 8px}
  .code{font:900 30px/1.2 "Courier New",Courier,monospace;letter-spacing:.12em;border:2px solid #000;padding:16px;text-align:center;margin:18px 0;user-select:all}
  a.btn{display:inline-block;font:900 13px/1 Arial,Helvetica,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:14px 22px;border:1px solid #000;background:#000;color:#fff;text-decoration:none}
  .msg{font:14px/1.5 Georgia,"Times New Roman",serif;font-style:italic;color:#444}
  .bad{color:#c00000}
  @media (prefers-color-scheme:dark){html,body{background:#12161b;color:#f2efe9}.mast{border-bottom-color:#f2efe9}.mast h1 a{color:#f2efe9}.code{border-color:#fdb512}a.btn{background:#fdb512;color:#12161b;border-color:#fdb512}.msg{color:#c6c1b8}.bad{color:#ff5b5b}}
</style>
</head>
<body data-bw-nogate>
<div class="wrap">
  <div class="mast"><h1><a href="{{ root }}">{{ site_name }}</a></h1><div class="desk">{{ desk.name or "Market Desk" }}</div></div>
  <h2>Welcome aboard</h2>
  <p id="lead" class="msg">Finding your code…</p>
  <div class="code" id="code" hidden></div>
  <p id="after" hidden>Save it somewhere: it is your key to the desk on every device. This browser is already signed in.</p>
  <p id="go" hidden><a class="btn" href="{{ root }}markets/">Open the Market Desk &rarr;</a></p>
</div>
<script>
(function () {
  var GATE = {{ gate_url|tojson }}, lead = document.getElementById('lead'), box = document.getElementById('code');
  var sid = new URLSearchParams(location.search).get('session_id');
  if (!sid || !GATE) { lead.className = 'msg bad'; lead.textContent = 'This page needs the link Stripe sends you to after paying. If you have paid and landed here by hand, write to us with your receipt.'; return; }
  fetch(GATE + '/gate/claim?session=' + encodeURIComponent(sid), { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); }).then(function (x) {
    if (!x[0] || !x[1].code) { lead.className = 'msg bad'; lead.textContent = x[1].error === 'not paid' ? 'Stripe has not confirmed the payment yet. Give it a minute and reload this page.' : 'Could not find your code (' + (x[1].error || 'unknown') + '). Reply to your Stripe receipt and we will sort it out.'; return; }
    lead.textContent = 'Your access code' + (x[1].email ? ' (for ' + x[1].email + ')' : '') + ':';
    box.textContent = x[1].code; box.hidden = false;
    document.getElementById('after').hidden = false; document.getElementById('go').hidden = false;
    try { localStorage.setItem('bw-desk-code', x[1].code); } catch (e) {}
  }).catch(function () { lead.className = 'msg bad'; lead.textContent = 'Could not reach the desk. Reload in a moment.'; });
})();
</script>
{% include "analytics.html" %}
</body>
</html>
