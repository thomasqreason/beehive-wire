<div class="scrim" id="scrim"><div class="modal" id="modal"><button class="x" id="mx" aria-label="Close">&times;</button><div id="mbody" class="wait">Loading chart…</div></div></div>
<script>
(function(){
  var scrim=document.getElementById('scrim'),body=document.getElementById('mbody');
  var STATUS={breakout:'Breakout',buy_zone:'In buy range',extended:'Extended',retest:'Back below buy point',setting_up:'Setting up',in_base:'In base',no_base:'No base'};
  function f2(x){return (x==null)?'–':Number(x).toFixed(2);}
  function pc(x){return (x==null)?'–':(x>=0?'+':'')+Number(x).toFixed(1)+'%';}
  function cls(x){return (x||0)>=0?'pos':'neg';}
  function niceStep(raw){if(raw<=0)return 1;var mag=Math.pow(10,Math.floor(Math.log10(raw)));var ms=[1,2,2.5,5,10];for(var i=0;i<ms.length;i++){if(raw<=ms[i]*mag)return ms[i]*mag;}return 10*mag;}
  function chart(d){
    var s=d.series,n=s.c.length,W=760,H=420,PL=8,PR=62,PT=10,PH=290,VT=318,VH=90,b=d.base;
    var xs=function(i){return PL+(i+0.5)*(W-PL-PR)/n;};
    var lo=Math.min.apply(null,s.l),hi=Math.max.apply(null,s.h);
    if(b&&b.buy_max)hi=Math.max(hi,b.buy_max);
    var pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad;
    var ys=function(p){return PT+(hi-p)/(hi-lo)*PH;};
    var vmax=Math.max.apply(null,s.v)||1,yv=function(v){return VT+VH-v/vmax*VH;};
    var bw=Math.max(1,(W-PL-PR)/n*0.6),o=[];
    o.push('<svg class="chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="'+W+'" height="'+H+'" fill="var(--chart-bg)"/>');
    if(b&&b.buy_point){var y1=ys(b.buy_max),y2=ys(b.buy_point);
      o.push('<rect x="'+PL+'" y="'+y1.toFixed(1)+'" width="'+(W-PL-PR)+'" height="'+Math.max(1,y2-y1).toFixed(1)+'" fill="var(--zone)"/>');
      o.push('<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--pivot)" stroke-dasharray="6 4" stroke-width="1.4"/>');
      o.push('<text x="'+(W-PR+4)+'" y="'+(y2+4).toFixed(1)+'" class="lbl pivot">buy '+f2(b.buy_point)+'</text>');
      if(s.rim_i!=null&&s.rim_i>=0&&s.rim_i<n)o.push('<circle cx="'+xs(s.rim_i).toFixed(1)+'" cy="'+ys(s.h[s.rim_i]).toFixed(1)+'" r="4" fill="none" stroke="var(--pivot)" stroke-width="1.5"/>');
      if(s.low_i!=null&&s.low_i>=0&&s.low_i<n)o.push('<circle cx="'+xs(s.low_i).toFixed(1)+'" cy="'+ys(s.l[s.low_i]).toFixed(1)+'" r="4" fill="none" stroke="var(--pivot)" stroke-width="1.5"/>');
      if(s.bo_i!=null&&s.bo_i>=0&&s.bo_i<n)o.push('<text x="'+xs(s.bo_i).toFixed(1)+'" y="'+(ys(s.h[s.bo_i])-8).toFixed(1)+'" class="lbl bo" text-anchor="middle">breakout</text>');}
    var step=niceStep((hi-lo)/5),g=Math.ceil(lo/step)*step;
    while(g<hi){var y=ys(g);o.push('<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="0.6"/><text x="'+(W-PR+4)+'" y="'+(y+4).toFixed(1)+'" class="lbl">'+(+g.toPrecision(6))+'</text>');g+=step;}
    var last=null,MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    for(var i=0;i<n;i++){var m=s.d[i].slice(0,7);if(m!==last){last=m;if(i>0)o.push('<text x="'+xs(i).toFixed(1)+'" y="'+(H-4)+'" class="lbl" text-anchor="middle">'+MON[parseInt(s.d[i].slice(5,7),10)-1]+'</text>');}}
    [['s200','var(--ma200)'],['s50','var(--ma50)'],['e21','var(--ma21)']].forEach(function(k){var pts=[];for(var i=0;i<n;i++){var v=s[k[0]][i];if(v!=null)pts.push(xs(i).toFixed(1)+','+ys(v).toFixed(1));}if(pts.length>1)o.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+k[1]+'" stroke-width="1.3"/>');});
    for(var i=0;i<n;i++){var up=s.c[i]>=(i?s.c[i-1]:s.o[i]),col=up?'var(--up)':'var(--dn)',x=xs(i);
      o.push('<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+ys(s.h[i]).toFixed(1)+'" y2="'+ys(s.l[i]).toFixed(1)+'" stroke="'+col+'" stroke-width="1.2"/>');
      o.push('<line x1="'+x.toFixed(1)+'" x2="'+(x+bw/2+1).toFixed(1)+'" y1="'+ys(s.c[i]).toFixed(1)+'" y2="'+ys(s.c[i]).toFixed(1)+'" stroke="'+col+'" stroke-width="1.6"/>');
      o.push('<rect x="'+(x-bw/2).toFixed(1)+'" y="'+yv(s.v[i]).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(VT+VH-yv(s.v[i])).toFixed(1)+'" fill="'+col+'" opacity=".75"/>');}
    if(s.avgv50)o.push('<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+yv(s.avgv50).toFixed(1)+'" y2="'+yv(s.avgv50).toFixed(1)+'" stroke="var(--avgv)" stroke-width="1.1"/>');
    o.push('<text x="'+(W-PR+4)+'" y="'+(VT+12)+'" class="lbl">vol</text><text x="'+(PL+4)+'" y="'+(PT+12)+'" class="lbl"><tspan fill="var(--ma21)">21-day</tspan>  <tspan fill="var(--ma50)">50-day</tspan>  <tspan fill="var(--ma200)">200-day</tspan></text></svg>');
    return o.join('');
  }
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function show(sym){
    scrim.classList.add('on');body.className='wait';body.textContent='Loading '+sym+'…';
    fetch('series/'+encodeURIComponent(sym)+'.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
      var b=d.base||{},h='<div class="kick"><span class="st">'+esc(STATUS[d.status]||d.status||'')+'</span>'+esc(d.industry||'')+'</div>';
      h+='<h2>'+esc(d.sym)+(d.name?' <span class="nm">&middot; '+esc(d.name)+'</span>':'')+' '+f2(d.close)+' <span class="'+cls(d.chg)+'" style="font-size:16px">'+(d.chg>=0?'+':'')+f2(d.chg)+' ('+pc(d.chg_pct)+')</span></h2>';
      h+='<div class="sub">'+esc(d.angle||'')+' &middot; prices through '+esc(d.date)+'</div>'+chart(d);
      h+='<div class="facts">';
      if(b.buy_point)h+='<div><b>Buy point</b>'+f2(b.buy_point)+'</div><div><b>Buy range</b>'+f2(b.buy_point)+' &ndash; '+f2(b.buy_max)+'</div><div><b>From buy point</b><span class="'+cls(d.from_pivot)+'">'+pc(d.from_pivot)+'</span></div><div><b>Base</b>'+esc(b.weeks)+'-week '+esc(b.kind)+', '+Math.round(b.depth||0)+'% deep</div>'+(b.breakout_date?'<div><b>Breakout</b>'+esc(b.breakout_date)+'</div>':'');
      h+='<div><b>RS rank</b>'+esc(d.rs_rank==null?'–':d.rs_rank)+'</div><div><b>Volume vs 50-day</b>'+(d.vol_ratio==null?'–':Number(d.vol_ratio).toFixed(1)+'x')+'</div><div><b>52-week high</b>'+f2(d.hi52)+' ('+pc(d.from_hi52)+')</div><div><b>vs 50-day line</b>'+pc(d.vs_sma50)+'</div>'+(d.ipo_sessions?'<div><b>New issue</b>'+d.ipo_sessions+' sessions</div>':'')+'</div>';
      body.className='';body.innerHTML=h;
      var sv=body.querySelector('svg.chart');if(sv&&window.BWXH){if(d.base&&d.base.buy_max)sv.setAttribute('data-buymax',d.base.buy_max);BWXH.attach(sv,d.series);}
    }).catch(function(e){body.className='wait';body.textContent='No chart saved for '+sym+' yet; the next scan that covers it will draw one.';});
  }
  function hide(){scrim.classList.remove('on');if(location.hash.indexOf('#chart=')===0)history.replaceState(null,'',location.pathname+location.search);}
  document.addEventListener('click',function(e){var a=e.target.closest('a.tk');if(a){e.preventDefault();history.replaceState(null,'','#chart='+a.getAttribute('data-sym'));show(a.getAttribute('data-sym'));}});
  document.getElementById('mx').addEventListener('click',hide);
  scrim.addEventListener('click',function(e){if(e.target===scrim)hide();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
  if(location.hash.indexOf('#chart=')===0)show(decodeURIComponent(location.hash.slice(7)));
})();
</script>
