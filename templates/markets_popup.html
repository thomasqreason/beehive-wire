<div class="scrim" id="scrim"><div class="modal" id="modal"><button class="x" id="mx" aria-label="Close">&times;</button><div id="mbody" class="wait">Loading chart…</div></div></div>
<script>{% include "markets_analyze.js" %}</script>
<script>
(function(){
  var scrim=document.getElementById('scrim'),body=document.getElementById('mbody');
  var STATUS={breakout:'Breakout',buy_zone:'In buy range',extended:'Extended',retest:'Back below buy point',setting_up:'Setting up',in_base:'In base',no_base:'No base'};
  function f2(x){return (x==null)?'–':Number(x).toFixed(2);}
  function pc(x){return (x==null)?'–':(x>=0?'+':'')+Number(x).toFixed(1)+'%';}
  function cls(x){return (x||0)>=0?'pos':'neg';}
  function niceStep(raw){if(raw<=0)return 1;var mag=Math.pow(10,Math.floor(Math.log10(raw)));var ms=[1,2,2.5,5,10];for(var i=0;i<ms.length;i++){if(raw<=ms[i]*mag)return ms[i]*mag;}return 10*mag;}
  function smaArr(c,n){var o=[],s=0;for(var i=0;i<c.length;i++){s+=c[i];if(i>=n)s-=c[i-n];o.push(i>=n-1?+(s/n).toFixed(2):null);}return o;}
  // Geometry. The chart is drawn at the pop-up's own pixel width, and every bar gets the same width whatever
  // the screen: a phone held upright shows fewer bars, turned sideways it shows more, a desktop more still —
  // nothing is squeezed to fit or stretched to fill (Todd, Oct 28, 2026). Intraday is pitched so a portrait
  // phone shows one full trading day of 5-minute bars (78); the others keep the desk's usual density.
  var PL=8,PR=62,H=420,PT=10,PH=290,VT=318,VH=90;
  var PITCH={d:5.3,w:6.3,m:12,i:4.5},DAY_BARS=78;
  function width(){return Math.max(300,body.clientWidth||760);}
  function fit(mode,W){var avail=W-PL-PR,p=PITCH[mode]||PITCH.d;if(mode==='i')p=Math.min(p,avail/DAY_BARS);return Math.max(10,Math.floor(avail/p));}
  function clip(s,k){var n=s.c.length;if(n<=k)return s;var off=n-k,o={};
    for(var key in s){var v=s[key];if(Array.isArray(v)&&v.length===n)o[key]=v.slice(off);else o[key]=v;}
    ['rim_i','low_i','bo_i'].forEach(function(key){if(s[key]!=null)o[key]=s[key]-off;});
    if(s.rsdot)o.rsdot=s.rsdot.map(function(i){return i-off;}).filter(function(i){return i>=0;});
    return o;}
  function frameOf(d,mode,W){
    var f;
    if(mode==='i'&&d.series&&d.series.i){var q=d.series.i;f={d:q.d,o:q.o,h:q.h,l:q.l,c:q.c,v:q.v,e21:smaArr(q.c,20),s50:smaArr(q.c,50),s200:[],avgv50:null,legend:['20-bar','50-bar',''],months:false,intra:true,mode:'i'};}
    else if(mode==='w'&&d.series&&d.series.w){var w=d.series.w;f={d:w.d,o:w.o,h:w.h,l:w.l,c:w.c,v:w.v,e21:smaArr(w.c,10),s50:smaArr(w.c,40),s200:[],avgv50:null,rs:w.rs,rsdot:w.rsdot,legend:['10-wk','40-wk',''],months:false,mode:'w'};}
    else if(mode==='m'&&d.series&&d.series.m){var m=d.series.m;f={d:m.d,o:m.o,h:m.h,l:m.l,c:m.c,v:m.v,e21:smaArr(m.c,10),s50:[],s200:[],avgv50:null,legend:['10-mo','',''],months:false,years:true,mode:'m'};}
    else{var s=d.series;f={d:s.d,o:s.o,h:s.h,l:s.l,c:s.c,v:s.v,e21:s.e21,s50:s.s50,s200:s.s200,avgv50:s.avgv50,rim_i:s.rim_i,low_i:s.low_i,bo_i:s.bo_i,rs:s.rs,rsdot:s.rsdot,legend:['21-day','50-day','200-day'],months:true,mode:'d'};}
    return W?clip(f,fit(f.mode,W)):f;
  }
  function chart(d,mode){
    var W=width(),s=frameOf(d,mode||'d',W),n=s.c.length,b=d.base;
    // Fewer bars than the width holds (a short history, or monthly): spread them a little, never past 1.6x.
    var slots=Math.max(n,Math.ceil((W-PL-PR)/(PITCH[s.mode]*1.6)));
    var xs=function(i){return PL+(i+slots-n+0.5)*(W-PL-PR)/slots;};
    var lo=Math.min.apply(null,s.l),hi=Math.max.apply(null,s.h);
    if(b&&b.buy_max&&!s.intra)hi=Math.max(hi,b.buy_max);
    var pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad;
    var ys=function(p){return PT+(hi-p)/(hi-lo)*PH;};
    var vmax=Math.max.apply(null,s.v)||1,yv=function(v){return VT+VH-v/vmax*VH;};
    var bw=Math.max(1,(W-PL-PR)/slots*0.6),o=[];
    o.push('<svg class="chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="'+W+'" height="'+H+'" fill="var(--chart-bg)"/>');
    // Intraday: a dotted line down the whole chart between one day's close and the next day's open.
    if(s.intra){var dk=null;for(var i=0;i<n;i++){var k=s.d[i].slice(0,10);if(k!==dk){if(dk!==null){var bx=(xs(i)-(W-PL-PR)/slots/2).toFixed(1);o.push('<line x1="'+bx+'" x2="'+bx+'" y1="'+PT+'" y2="'+(VT+VH)+'" stroke="var(--mut)" stroke-width="1" stroke-dasharray="1.5 3.5" opacity=".8"/>');}dk=k;}}}
    // Intraday, the buy point is drawn only when it falls inside the five days' own range; the zone never stretches the scale.
    if(b&&b.buy_point&&(!s.intra||(b.buy_point>lo&&b.buy_point<hi))){var y1=Math.max(PT,ys(Math.min(b.buy_max||b.buy_point,hi))),y2=ys(b.buy_point);
      o.push('<rect x="'+PL+'" y="'+y1.toFixed(1)+'" width="'+(W-PL-PR)+'" height="'+Math.max(1,y2-y1).toFixed(1)+'" fill="var(--zone)"/>');
      o.push('<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--pivot)" stroke-dasharray="6 4" stroke-width="1.4"/>');
      o.push('<text x="'+(W-PR+4)+'" y="'+(y2+4).toFixed(1)+'" class="lbl pivot">buy '+f2(b.buy_point)+'</text>');
      if(s.rim_i!=null&&s.rim_i>=0&&s.rim_i<n)o.push('<circle cx="'+xs(s.rim_i).toFixed(1)+'" cy="'+ys(s.h[s.rim_i]).toFixed(1)+'" r="4" fill="none" stroke="var(--pivot)" stroke-width="1.5"/>');
      if(s.low_i!=null&&s.low_i>=0&&s.low_i<n)o.push('<circle cx="'+xs(s.low_i).toFixed(1)+'" cy="'+ys(s.l[s.low_i]).toFixed(1)+'" r="4" fill="none" stroke="var(--pivot)" stroke-width="1.5"/>');
      if(s.bo_i!=null&&s.bo_i>=0&&s.bo_i<n)o.push('<text x="'+xs(s.bo_i).toFixed(1)+'" y="'+(ys(s.h[s.bo_i])-8).toFixed(1)+'" class="lbl bo" text-anchor="middle">breakout</text>');}
    var step=niceStep((hi-lo)/5),g=Math.ceil(lo/step)*step;
    while(g<hi){var y=ys(g);o.push('<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="0.6"/><text x="'+(W-PR+4)+'" y="'+(y+4).toFixed(1)+'" class="lbl">'+(+g.toPrecision(6))+'</text>');g+=step;}
    var last=null,MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    if(s.intra){var spans=[],ks=null;for(var i=0;i<n;i++){var kk=s.d[i].slice(0,10);if(kk!==ks){ks=kk;spans.push([i,i]);}else spans[spans.length-1][1]=i;}
      spans.forEach(function(sp){var dd=new Date(s.d[sp[0]].slice(0,10)+'T12:00:00');o.push('<text x="'+xs((sp[0]+sp[1])/2).toFixed(1)+'" y="'+(H-4)+'" class="lbl" text-anchor="middle">'+DOW[dd.getDay()]+' '+MON[dd.getMonth()]+' '+dd.getDate()+'</text>');});}
    for(var i=0;i<n&&!s.intra;i++){var key=s.years?s.d[i].slice(0,4):(s.months?s.d[i].slice(0,7):s.d[i].slice(0,7));
      if(key!==last){last=key;if(i>0){var lab=s.years?key:(s.months?MON[parseInt(s.d[i].slice(5,7),10)-1]:(s.d[i].slice(5,7)==='01'?s.d[i].slice(0,4):MON[parseInt(s.d[i].slice(5,7),10)-1]));
        if(s.months||s.years||(parseInt(s.d[i].slice(5,7),10)%3===1))o.push('<text x="'+xs(i).toFixed(1)+'" y="'+(H-4)+'" class="lbl" text-anchor="middle">'+lab+'</text>');}}}
    var rs=s.rs||[],rv=rs.filter(function(v){return v!=null;});
    if(rv.length>5){var rlo=Math.min.apply(null,rv),rhi=Math.max.apply(null,rv),rng=(rhi-rlo)||1e-9,rp=[],li=-1;
      for(var i=0;i<n;i++){if(rs[i]!=null){rp.push(xs(i).toFixed(1)+','+(PT+PH*(0.95-0.33*(rs[i]-rlo)/rng)).toFixed(1));li=i;}}
      o.push('<polyline points="'+rp.join(' ')+'" fill="none" stroke="var(--rs)" stroke-width="1.3" opacity=".9"/>');
      var ly=PT+PH*(0.95-0.33*(rs[li]-rlo)/rng);
      o.push('<text x="'+(xs(li)+5).toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" class="lbl rsl">RS'+(d.rs_rank!=null?' '+d.rs_rank:'')+'</text>');
      (s.rsdot||[]).forEach(function(di){if(di>=0&&di<n&&rs[di]!=null)o.push('<circle cx="'+xs(di).toFixed(1)+'" cy="'+(PT+PH*(0.95-0.33*(rs[di]-rlo)/rng)).toFixed(1)+'" r="3.2" fill="var(--rs)"/>');});
      if((s.rsdot||[]).indexOf(li)>=0){o.push('<text x="'+(PL+4)+'" y="'+(PT+28)+'" class="lbl rsl">RS line at a new 52-week high</text>');}}
    [['s200','var(--ma200)'],['s50','var(--ma50)'],['e21','var(--ma21)']].forEach(function(k){var arr=s[k[0]]||[],pts=[];for(var i=0;i<n;i++){var v=arr[i];if(v!=null)pts.push(xs(i).toFixed(1)+','+ys(v).toFixed(1));}if(pts.length>1)o.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+k[1]+'" stroke-width="1.3"/>');});
    for(var i=0;i<n;i++){var up=s.c[i]>=(i?s.c[i-1]:s.o[i]),col=up?'var(--up)':'var(--dn)',x=xs(i);
      o.push('<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+ys(s.h[i]).toFixed(1)+'" y2="'+ys(s.l[i]).toFixed(1)+'" stroke="'+col+'" stroke-width="1.2"/>');
      o.push('<line x1="'+x.toFixed(1)+'" x2="'+(x+bw/2+1).toFixed(1)+'" y1="'+ys(s.c[i]).toFixed(1)+'" y2="'+ys(s.c[i]).toFixed(1)+'" stroke="'+col+'" stroke-width="1.6"/>');
      o.push('<rect x="'+(x-bw/2).toFixed(1)+'" y="'+yv(s.v[i]).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(VT+VH-yv(s.v[i])).toFixed(1)+'" fill="'+col+'" opacity=".75"/>');}
    if(s.avgv50)o.push('<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+yv(s.avgv50).toFixed(1)+'" y2="'+yv(s.avgv50).toFixed(1)+'" stroke="var(--avgv)" stroke-width="1.1"/>');
    var lg=s.legend||['21-day','50-day','200-day'];
    o.push('<text x="'+(W-PR+4)+'" y="'+(VT+12)+'" class="lbl">vol</text><text x="'+(PL+4)+'" y="'+(PT+12)+'" class="lbl"><tspan fill="var(--ma21)">'+lg[0]+'</tspan>  <tspan fill="var(--ma50)">'+lg[1]+'</tspan>  <tspan fill="var(--ma200)">'+lg[2]+'</tspan></text></svg>');
    return o.join('');
  }
  // Daily, Weekly, Monthly, then Intraday last on the right (Todd, Oct 28, 2026) — on every chart, desk-list
  // names and typed tickers alike. Intraday bars come from the relay the first time the tab is pressed.
  function tabs(d){
    var has=d.series&&d.series.w;
    return '<div class="tabs"><button type="button" data-fr="d" class="on">Daily</button>'+(has?'<button type="button" data-fr="w">Weekly</button>':'')+(d.series&&d.series.m?'<button type="button" data-fr="m">Monthly</button>':'')+(RELAY?'<button type="button" data-fr="i">Intraday</button>':'')+'</div>';
  }
  function intraday(d){
    if(d.series&&d.series.i)return Promise.resolve(d.series.i);
    return fetch(RELAY+(RELAY.indexOf('?')<0?'?':'&')+'intra='+encodeURIComponent(d.sym)).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||!j.c||j.c.length<10)throw new Error('none');d.series=d.series||{};d.series.i=j;return j;});
  }
  function wireTabs(container,d){
    var box=container.querySelector('.tabs');if(!box)return;
    var cur='d';
    function draw(mode){cur=mode;var old=container.querySelector('svg.chart');if(!old)return;var tmp=document.createElement('div');tmp.innerHTML=chart(d,mode);var sv=tmp.firstChild;
      old.parentNode.replaceChild(sv,old);
      if(window.BWXH){if(d.base&&d.base.buy_max&&mode!=='i')sv.setAttribute('data-buymax',d.base.buy_max);BWXH.attach(sv,frameOf(d,mode,width()));}}
    REDRAW=function(){if(body.getAttribute('data-sym')===d.sym)draw(cur);};
    function pick(b){box.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});}
    box.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;
      var mode=b.getAttribute('data-fr'),note=container.querySelector('.tabnote');if(note)note.parentNode.removeChild(note);
      if(mode!=='i'){pick(b);draw(mode);return;}
      var was=box.querySelector('button.on');b.disabled=true;b.textContent='Intraday\u2026';
      intraday(d).then(function(){b.disabled=false;b.textContent='Intraday';pick(b);draw('i');})
        .catch(function(){b.disabled=false;b.textContent='Intraday';if(was)pick(was);
          var n=document.createElement('div');n.className='sub tabnote';n.textContent='No intraday bars for '+d.sym+' right now. If this keeps happening the relay on Cloudflare needs the current quote-worker.js (relay/README.md).';box.parentNode.insertBefore(n,box.nextSibling);});
    });
  }
  // Turn the phone, resize the window: the open chart is drawn again for the new width, same bars per inch.
  var REDRAW=null,rt=null,lastW=0;
  function onResize(){if(!scrim.classList.contains('on')||!REDRAW)return;var w=width();if(w===lastW)return;lastW=w;REDRAW();}
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(onResize,120);});
  window.addEventListener('orientationchange',function(){clearTimeout(rt);rt=setTimeout(onResize,250);});
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function show(sym){
    if(window.BW_LIVE_ON&&RELAY)return fresh(sym);   // tables are live, so the chart is too: same price, same status
    scrim.classList.add('on');body.className='wait';body.textContent='Loading '+sym+'…';
    fetch(MBASE+'series/'+encodeURIComponent(sym)+'.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(render)
      .catch(function(e){if(RELAY){fresh(sym);}else{body.className='wait';body.textContent='No chart saved for '+sym+' yet; the next scan that covers it will draw one.';}});
  }
  // The quote box: any ticker, analysed on the spot with the desk's own rules (markets_analyze.js) from two years
  // of daily bars the relay fetches. RS rank is against the universe the last pass ranked (rs_dist.json).
  var RELAY={{ (desk.quote_relay or '')|tojson }};
  var MBASE={{ ((root or '../') ~ 'markets/')|tojson }};   // pages one folder down (movers/) still read /markets/series/
  var DIST=null;
  function dist(){return DIST?Promise.resolve(DIST):fetch(MBASE+'rs_dist.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(j){DIST=j&&j.scores||[];return DIST;}).catch(function(){return [];});}
  // Weekly / monthly frames, the RS line and the desk score for a ticker analysed in the browser (the quote box),
  // so it matches what a desk-list name gets from the server.
  var SPX=null;
  function spx(){if(SPX)return Promise.resolve(SPX);return fetch(RELAY+(RELAY.indexOf('?')<0?'?':'&')+'hist='+encodeURIComponent('^GSPC')).then(function(r){return r.ok?r.json():null;}).then(function(j){SPX=j&&j.c?j:null;return SPX;}).catch(function(){return null;});}
  function bucketKey(ds,mode){var dt=new Date(ds+'T12:00:00');if(mode==='m')return ds.slice(0,7);var day=dt.getDay();var fri=new Date(dt);fri.setDate(dt.getDate()+((5-day+7)%7));return fri.toISOString().slice(0,10);}
  function resample(j,mode,keep,rsByDate){var out={d:[],o:[],h:[],l:[],c:[],v:[],rs:[]},key=null,k=-1;
    for(var i=0;i<j.c.length;i++){var kk=bucketKey(j.d[i],mode);if(kk!==key){key=kk;k++;out.d.push(j.d[i]);out.o.push(j.o[i]);out.h.push(j.h[i]);out.l.push(j.l[i]);out.c.push(j.c[i]);out.v.push(j.v[i]);out.rs.push(rsByDate?rsByDate[j.d[i]]||null:null);}
      else{out.d[k]=j.d[i];out.h[k]=Math.max(out.h[k],j.h[i]);out.l[k]=Math.min(out.l[k],j.l[i]);out.c[k]=j.c[i];out.v[k]+=j.v[i];out.rs[k]=rsByDate?rsByDate[j.d[i]]||out.rs[k]:null;}}
    var n=out.d.length,s=Math.max(0,n-keep);['d','o','h','l','c','v','rs'].forEach(function(f){out[f]=out[f].slice(s);});return out;}
  function enrichFresh(d,j,sp){
    var rsBy=null;
    if(sp&&sp.c){var sm={};for(var i=0;i<sp.d.length;i++)sm[sp.d[i]]=sp.c[i];rsBy={};for(var i=0;i<j.d.length;i++){if(sm[j.d[i]])rsBy[j.d[i]]=j.c[i]/sm[j.d[i]];}
      d.series.rs=d.series.d.map(function(ds){return rsBy[ds]||null;});
      var all=j.d.map(function(ds){return rsBy[ds]||null;}),dotD={};for(var i=20;i<all.length;i++){if(all[i]==null)continue;var mx=-Infinity;for(var k=Math.max(0,i-252);k<i;k++){if(all[k]!=null&&all[k]>mx)mx=all[k];}if(all[i]>=mx)dotD[j.d[i]]=1;}
      d.series.rsdot=[];d.series.d.forEach(function(ds,i){if(dotD[ds])d.series.rsdot.push(i);});d.__dotD=dotD;
      var last=rsBy[j.d[j.d.length-1]],win=j.d.slice(-252).map(function(ds){return rsBy[ds];}).filter(Boolean);
      if(last&&win.length)d.rs_line={new_high:last>=Math.max.apply(null,win),from_high:(last/Math.max.apply(null,win)-1)*100};}
    d.series.w=resample(j,'w',110,rsBy);d.series.m=resample(j,'m',36,null);
    if(d.__dotD){var wd=d.series.w.d;d.series.w.rsdot=[];wd.forEach(function(wend,wi){var ws=wi?wd[wi-1]:'';for(var dd in d.__dotD){if(dd>ws&&dd<=wend){d.series.w.rsdot.push(wi);break;}}});}
    if(d.rs_rank!=null){var tech=0,parts=[];if((d.vs_sma50||-99)>0){tech+=25;parts.push('above 50-day');}if((d.vs_sma200||-99)>0){tech+=25;parts.push('above 200-day');}
      if((d.from_hi52||-99)>=-15){tech+=25;parts.push('within 15% of high');}if(['breakout','buy_zone','setting_up','extended'].indexOf(d.status)>=0){tech+=25;parts.push('buyable pattern');}
      if(d.rs_line&&d.rs_line.new_high){tech+=10;parts.push('RS line high');}tech=Math.min(tech,100);
      d.desk_score={score:+(0.4*d.rs_rank+0.25*tech).toFixed(1),rs_pts:+(0.4*d.rs_rank).toFixed(1),eps_pts:0,rev_pts:0,tech_pts:+(0.25*tech).toFixed(1),tech_parts:parts,have_fund:false,
        note:'fundamentals are not fetched for a typed ticker; EPS and revenue count as zero here'};}
    return d;
  }
  function fresh(sym){
    scrim.classList.add('on');body.className='wait';body.textContent='Charting '+sym+'…';
    Promise.all([fetch(RELAY+(RELAY.indexOf('?')<0?'?':'&')+'hist='+encodeURIComponent(sym)).then(function(r){return r.ok?r.json():null;}),dist(),spx()]).then(function(x){
      var j=x[0];if(!j||!j.c||!j.c.length)throw new Error('none');
      var d=window.BWA&&BWA.analyze(sym,j,{buyZonePct:{{ desk.buy_zone_pct or 5 }},chartBars:{{ desk.chart_bars or 130 }}});if(!d)throw new Error('short');
      d.name=j.name;d.industry=j.industry||j.sector;d.rs_rank=BWA.rsRank(d.rs_score,x[1]);
      try{enrichFresh(d,j,x[2]);}catch(e){}
      render(d);
    }).catch(function(){body.className='wait';body.textContent='Couldn\'t find '+sym+'. Check the ticker (class shares use a dash, like BRK-B).';});
  }
  function render(d){
      var b=d.base||{},h='<div class="kick"><span class="st">'+esc(STATUS[d.status]||d.status||'')+'</span>'+esc(d.industry||'')+'</div>';
      h+='<h2>'+esc(d.sym)+(d.name?' <span class="nm">&middot; '+esc(d.name)+'</span>':'')+' <span class="px">'+f2(d.close)+'</span> <span class="pchg '+cls(d.chg)+'" style="font-size:16px">'+(d.chg>=0?'+':'')+f2(d.chg)+' ('+pc(d.chg_pct)+')</span></h2>';
      h+='<div class="sub">'+esc(d.angle||'')+' &middot; prices through '+esc(d.date)+'</div>'+tabs(d)+chart(d,'d');
      h+='<div class="facts">';
      (d.aggressive||[]).forEach(function(a){if(a&&a.live)h+='<div><b>Aggressive entry: '+esc(a.kind)+'</b>'+f2(a.price)+' <span class="st">('+pc(a.from_price)+' from here)</span></div>';});
      if(d.next_earnings)h+='<div><b>Next earnings</b>'+esc(d.next_earnings)+'</div>';
      if(d.blue_dot||(d.series&&d.series.rsdot&&d.series.rsdot.indexOf(d.series.c.length-1)>=0))h+='<div><b>RS line</b><span style="color:var(--rs);font-weight:900">New 52-week high today</span></div>';
      var ds=d.desk_score;if(ds){h+='<div><b>Desk score</b><span style="font-size:16px;font-weight:900">'+ds.score+'</span> <span class="st">of 100</span><br><span class="st">RS '+ds.rs_pts+' + EPS '+ds.eps_pts+(ds.eps_yoy!=null?' ('+(ds.eps_yoy>=0?'+':'')+Math.round(ds.eps_yoy)+'%)':'')+' + Rev '+ds.rev_pts+(ds.rev_yoy!=null?' ('+(ds.rev_yoy>=0?'+':'')+Math.round(ds.rev_yoy)+'%)':'')+' + Chart '+ds.tech_pts+(ds.tech_parts&&ds.tech_parts.length?' ('+esc(ds.tech_parts.join(', '))+')':'')+(ds.note?' · '+esc(ds.note):'')+'</span></div>';}
      if(b.buy_point)h+='<div><b>Buy point</b>'+f2(b.buy_point)+'</div><div><b>Buy range</b>'+f2(b.buy_point)+' &ndash; '+f2(b.buy_max)+'</div><div><b>From buy point</b><span class="'+cls(d.from_pivot)+'">'+pc(d.from_pivot)+'</span></div><div><b>Base</b>'+esc(b.weeks)+'-week '+esc(b.kind)+', '+Math.round(b.depth||0)+'% deep</div>'+(b.breakout_date?'<div><b>Breakout</b>'+esc(b.breakout_date)+'</div>':'');
      h+='<div><b>RS rank</b>'+esc(d.rs_rank==null?'–':d.rs_rank)+'</div><div><b>Volume vs 50-day</b>'+(d.vol_ratio==null?'–':Number(d.vol_ratio).toFixed(1)+'x')+'</div><div><b>52-week high</b>'+f2(d.hi52)+' ('+pc(d.from_hi52)+')</div><div><b>vs 50-day line</b>'+pc(d.vs_sma50)+'</div><div><b>vs 21-day line</b>'+pc(d.vs_ema21)+(d.ext_atr==null?'':' <span class="st">('+(d.ext_atr>0?'+':'')+Number(d.ext_atr).toFixed(1)+' ATR)</span>')+'</div>'+(d.ipo_sessions?'<div><b>New issue</b>'+d.ipo_sessions+' sessions</div>':'')+'</div>';
      body.className='';body.innerHTML=h;body.setAttribute('data-sym',d.sym);
      lastW=width();
      var sv=body.querySelector('svg.chart');if(sv&&window.BWXH){if(d.base&&d.base.buy_max)sv.setAttribute('data-buymax',d.base.buy_max);BWXH.attach(sv,frameOf(d,'d',lastW));}
      wireTabs(body,d);
      live(d.sym);
  }
  // Live price from the quote relay (markets.yaml desk.quote_relay). The pass price stays if it fails.
  var SESSION={pre:'Pre-market',post:'After hours',overnight:'Overnight'};
  function clock(t){try{return new Date(t*1000).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Denver'})+' MT';}catch(e){return '';}}
  function day(t){try{var d=new Date(t*1000),n=new Date();return d.toDateString()===n.toDateString()?'':d.toLocaleDateString('en-US',{weekday:'short',timeZone:'America/Denver'})+' ';}catch(e){return '';}}
  function line(label,p,c,cp,t,cl){return '<div class="lq'+(cl?' '+cl:'')+'"><b>'+label+'</b> '+f2(p)+' <span class="'+cls(c)+'">'+(c>=0?'+':'')+f2(c)+' ('+pc(cp)+')</span> <span class="lt">'+day(t)+clock(t)+'</span></div>';}
  function live(sym){
    if(!RELAY)return;
    fetch(RELAY+(RELAY.indexOf('?')<0?'?':'&')+'s='+encodeURIComponent(sym)).then(function(r){return r.ok?r.json():null;}).then(function(j){
      var q=j&&j.quotes&&j.quotes[sym];if(!q||!q.regular||body.getAttribute('data-sym')!==sym)return;
      var r=q.regular,x=q.extended,h=body.querySelector('h2'),el=document.createElement('div');el.className='lquote';
      el.innerHTML=line(q.live?'Live':'At close',r.price,r.chg,r.chgPct,r.time,q.live?'on':'')+(x?line(SESSION[x.session]||'Extended',x.price,x.chg,x.chgPct,x.time,'on'):'');
      if(h){h.parentNode.insertBefore(el,h.nextSibling);
        var top=x||r,px=h.querySelector('.px'),pg=h.querySelector('.pchg');   // the headline shows the freshest price
        if(px)px.textContent=f2(top.price);
        if(pg){pg.className='pchg '+cls(top.chg);pg.textContent=(top.chg>=0?'+':'')+f2(top.chg)+' ('+pc(top.chgPct)+')';}}
    }).catch(function(){});
  }
  function hide(){scrim.classList.remove('on');if(/^#(chart|quote)=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);}
  var qb=document.getElementById('qbox');
  if(qb)qb.addEventListener('submit',function(e){e.preventDefault();var inp=document.getElementById('qsym');
    var s=(inp.value||'').trim().toUpperCase().replace(/^\$/,'').replace(/^([A-Z]+)[.\/]([A-Z])$/,'$1-$2');
    if(!/^[A-Z0-9.\-^=]{1,12}$/.test(s))return;inp.blur();history.replaceState(null,'','#quote='+s);fresh(s);});
  document.addEventListener('click',function(e){var a=e.target.closest('a.tk');if(a){e.preventDefault();history.replaceState(null,'','#chart='+a.getAttribute('data-sym'));show(a.getAttribute('data-sym'));}});
  document.getElementById('mx').addEventListener('click',hide);
  scrim.addEventListener('click',function(e){if(e.target===scrim)hide();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
  if(location.hash.indexOf('#chart=')===0)show(decodeURIComponent(location.hash.slice(7)));
  else if(location.hash.indexOf('#quote=')===0&&RELAY)fresh(decodeURIComponent(location.hash.slice(7)));
})();
</script>
