<style>
  :root{color-scheme:light;
    --bg:#fff;--ink:#000;--mut:#666;--rule:#000;--soft:#e6e6e6;--card:#f6f6f3;
    --chart-bg:#fff;--grid:#ddd;--up:#2457c5;--dn:#d63384;--ma21:#1f9d55;--ma50:#d62828;--ma200:#333;--avgv:#d62828;--rs:#2457c5;
    --zone:rgba(31,157,85,.13);--pivot:#1f9d55;--pos:#177245;--neg:#b3261e;--tag:#000;--tagink:#fff;--coral:#d9532f}
  html[data-theme="dark"]{color-scheme:dark;
    --bg:#12161b;--ink:#f2efe9;--mut:#99a3ad;--rule:#f2efe9;--soft:#39434f;--card:#1b212a;
    --chart-bg:#161b22;--grid:#2a323c;--up:#6aa0ff;--dn:#ff6aa8;--ma21:#3ccf7a;--ma50:#ff6b6b;--ma200:#c9d1d9;--avgv:#ff6b6b;--rs:#6aa0ff;
    --zone:rgba(60,207,122,.16);--pivot:#3ccf7a;--pos:#3ccf7a;--neg:#ff6b6b;--tag:#fdb512;--tagink:#12161b;--coral:#ff8a65}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45}
  a{color:var(--ink)}
  a:hover{background:var(--ink);color:var(--bg);text-decoration:none}
  .wrap{max-width:860px;margin:0 auto;padding:10px 16px 48px}
  .mast{text-align:center;padding:14px 0 8px;border-bottom:4px double var(--rule)}
  .mast h1{margin:0;font:900 34px/1 "Arial Black",Impact,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .mast h1 a{text-decoration:none}
  .mast h1 a:hover{background:none;color:var(--mut)}
  .mast h1 span{display:block;font-size:17px;letter-spacing:.34em;margin-top:6px}
  .mast .stamp{font-size:12px;color:var(--mut);margin-top:8px;letter-spacing:.04em;text-transform:uppercase}
  .mast .tag{font-size:12px;color:var(--mut);margin-top:3px}
  .pulse{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;padding:10px 0;border-bottom:1px solid var(--soft);font-size:13px}
  .pulse b{font-weight:900}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .note{margin:16px 0 4px;font-size:15px;line-height:1.5;border-left:4px solid var(--tag);padding-left:12px}
  .toc{margin:18px 0 8px;padding:0;list-style:none;font-size:13px;line-height:1.7}
  .toc li{display:inline}
  .toc li:not(:last-child)::after{content:" \00b7 ";color:var(--mut)}
  .toc a{text-decoration:none;font-weight:700}
  .toc a:hover{text-decoration:underline;background:none;color:var(--ink)}
  article{padding:26px 0 18px;border-top:1px solid var(--rule)}
  article:first-of-type{border-top:none}
  .kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .kick .st{display:inline-block;background:var(--tag);color:var(--tagink);padding:2px 7px;margin-right:8px;letter-spacing:.14em;font-weight:900}
  article h2{font:900 26px/1.15 "Arial Black",Impact,Arial,sans-serif;margin:8px 0 6px;letter-spacing:-.005em}
  article h2 a{text-decoration:none}
  .deck{font-size:16px;color:var(--mut);margin:0 0 14px;line-height:1.4}
  .chart{width:100%;height:auto;display:block;border:1px solid var(--soft);margin:6px 0 10px}
  .chart .lbl{font:11px Arial,Helvetica,sans-serif;fill:var(--mut)}
  .chart .lbl.pivot{fill:var(--pivot);font-weight:700}
  .chart{touch-action:pan-y;cursor:crosshair}
  .chart .xh line{stroke:var(--ink);stroke-width:.8;stroke-dasharray:3 3;opacity:.7}
  .chart .xh rect.box{fill:var(--card);stroke:var(--soft);opacity:.96}
  .chart .xh text{font:11.5px Arial,Helvetica,sans-serif;fill:var(--ink)}
  .chart .xh text .k{fill:var(--mut);font-size:9.5px;letter-spacing:.1em}
  .chart .xh text .pos{fill:var(--pos)} .chart .xh text .neg{fill:var(--neg)}
  .chart .xh circle{fill:var(--ink)}
  .chart .lbl.rsl{fill:var(--rs);font-weight:700}
  .chart .lbl.bo{fill:var(--pivot);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10px}
  .chart .earn{fill:var(--ink);font-weight:700}
  .chart .earn.soon{fill:var(--coral)}
  .board td.earn.soon{color:var(--coral);font-weight:700}
  .kick .ps{margin-right:8px;color:var(--ink);font-weight:700;letter-spacing:.12em}
  .dist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 22px;margin:8px 0 0}
  .board.distt{font-size:12px}
  .board.distt td.st{white-space:normal;text-align:left;min-width:120px}
  .board.distt th[colspan]{text-align:left;color:var(--ink);letter-spacing:.1em}
  .board.distt tr.exp td{color:var(--mut);text-decoration:line-through}
  .board.distt tr.exp td .st{text-decoration:none}
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;background:var(--card);padding:12px 14px;margin:0 0 16px;font-size:13px}
  .facts div b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .body p{margin:0 0 12px}
  .watch{margin:14px 0 0;padding:10px 14px;border:1px solid var(--soft);font-size:14px}
  .watch b{letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-right:8px}
  .qtrs{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 14px}
  .qtrs th,.qtrs td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--soft)}
  .qtrs th:first-child,.qtrs td:first-child{text-align:left}
  .qtrs th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .news{margin:12px 0 0;font-size:13px}
  .news b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
  .news a{display:block;margin:2px 0;text-decoration:none}
  .news a:hover{text-decoration:underline;background:none;color:var(--ink)}
  .news span{color:var(--mut)}
  .by{font-size:11px;color:var(--mut);margin-top:10px}
  h3.sec{font:900 14px/1 "Arial Black",Impact,Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;margin:34px 0 10px;padding-top:18px;border-top:4px double var(--rule)}
  table.board{width:100%;border-collapse:collapse;font-size:13px}
  .board th,.board td{padding:5px 6px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
  .board th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-align:right}
  .board th:nth-child(-n+2),.board td:nth-child(-n+2){text-align:left}
  .board td.sym{font-weight:900}
  .board td.sym a{text-decoration:none}
  .board .st{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  .board .story{color:var(--pivot);font-weight:700}
  .board td.story a{color:var(--pivot)}
  .tblwrap{overflow:auto;max-height:82vh}   /* the wrapper scrolls both ways, so the header row and the ticker column can both pin */
  .board th{position:sticky;top:0;z-index:3;background:var(--bg);box-shadow:0 2px 0 var(--soft)}
  .board th:first-child,.board.ranked th:nth-child(2){z-index:4}
  /* Frozen ticker column: the symbol (and the rank, on the ranked lists) stays put while the table scrolls sideways. */
  .board td.sym,.board th:first-child,.mini td.sym{position:sticky;left:0;z-index:2;background:var(--bg);box-shadow:2px 0 0 var(--soft)}
  .board.ranked td:first-child,.board.ranked th:first-child{position:sticky;left:0;z-index:3;background:var(--bg);min-width:58px;box-sizing:border-box;box-shadow:none}
  .board.ranked td.sym,.board.ranked th:nth-child(2){position:sticky;left:58px;z-index:2;background:var(--bg);box-shadow:2px 0 0 var(--soft)}
  .board.ranked th:nth-child(2){z-index:4}
  .bigpic{margin:14px 0 0;font-size:14px;line-height:1.5}
  .bigpic .st{display:inline-block;background:var(--tag);color:var(--tagink);padding:2px 7px;margin-right:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:900}
  .lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px 28px}
  .list>b{display:block;font:900 13px/1 "Arial Black",Impact,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:8px 0 2px}
  .list .blurb{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
  .list .none{font-size:13px;color:var(--mut)}
  table.mini{width:100%;border-collapse:collapse;font-size:13px}
  .mini td{padding:3px 6px 3px 0;border-bottom:1px solid var(--soft);white-space:nowrap}
  .mini td.sym{font-weight:900}
  .mini td.sym a{text-decoration:none;color:var(--pivot)}
  .mini td.st{font-size:11px;color:var(--mut);letter-spacing:.04em;white-space:normal}
  article.corner .body p{font-size:16px}
  ul.take{margin:6px 0 0;padding-left:18px}
  ul.take li{margin:3px 0}
  a.tk{text-decoration:none;border-bottom:1px dotted var(--mut)}
  a.tk:hover{background:none;color:var(--pivot);border-bottom-color:var(--pivot)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:24px 10px;overflow:auto}
  .scrim.on{display:flex}
  .modal{background:var(--bg);color:var(--ink);width:100%;padding:16px 18px 18px;border:1px solid var(--soft);position:relative;box-sizing:border-box}
  .modal .x{position:absolute;top:8px;right:10px;font:900 22px/1 Arial,sans-serif;background:none;border:0;color:var(--mut);cursor:pointer}
  .modal h2{font:900 22px/1.15 "Arial Black",Impact,Arial,sans-serif;margin:4px 28px 4px 0}
  .modal h2 .nm{font:700 15px/1.2 Arial,sans-serif;color:var(--mut);letter-spacing:0}
  .livetag{font-size:13px;color:var(--mut);margin:4px 0 8px}
  .livetag .dot,.livemini .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pivot);margin-right:6px;vertical-align:1px;animation:bwpulse 2s infinite}
  .livemini{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pivot);margin:2px 0 4px}
  .relive{border:1px solid var(--soft);background:var(--bg);color:var(--ink);font-size:14px;line-height:1;padding:3px 7px;cursor:pointer;margin-left:4px}
  @keyframes bwpulse{0%,100%{opacity:1}50%{opacity:.3}}
  /* The quote box: pinned to the bottom of the screen on every Market Desk page, above the chart pop-up so
     another ticker can be typed without closing the one that's open. */
  .qbox{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;align-items:center;margin:0;
        padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
        border-top:2px solid var(--rule);background:var(--card);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
  .qbox>*{max-width:860px}
  .qbox label{font:900 11px/1 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}
  .qbox input{flex:1;min-width:0;font:700 16px/1.2 Arial,sans-serif;text-transform:uppercase;padding:8px;border:1px solid var(--soft);background:var(--bg);color:var(--ink);border-radius:0}
  .qbox input::placeholder{text-transform:none;font-weight:400;color:var(--mut)}
  .qbox button{font:900 12px/1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;border:0;background:var(--tag);color:var(--tagink);cursor:pointer;white-space:nowrap}
  body.has-qbox{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  body.has-qbox .scrim{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .modal .lquote{margin:2px 0 6px;font-size:14px}
  .modal .lq{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;color:var(--mut)}
  .modal .lq b{font-size:10px;letter-spacing:.15em;text-transform:uppercase;min-width:86px}
  .modal .lq.on b{color:var(--pivot)}
  .modal .lq .lt{font-size:12px}
  .modal .sub{font-size:13px;color:var(--mut);margin-bottom:8px}
  .modal .facts{margin:10px 0 0}
  .modal .wait{padding:40px;text-align:center;color:var(--mut)}
  .chief .verdict{font-size:17px;line-height:1.5;margin:0 0 8px;border-left:4px solid var(--tag);padding-left:12px}
  .chief .mkt{font-size:14px;color:var(--mut);margin:0 0 12px}
  .chief .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 18px;margin:0 0 12px}
  .chief .pick{background:var(--card);padding:10px 12px}
  .chief .pk{font:900 15px/1.3 "Arial Black",Impact,Arial,sans-serif}
  .chief .pk .st{display:inline-block;background:var(--tag);color:var(--tagink);padding:2px 7px;margin-right:6px;font:900 10px/1.4 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
  .chief .why{font-size:14px;margin-top:6px}
  .chief .entry{font-size:13px;color:var(--mut);margin-top:6px}
  .chief .entry b,.chief .mkt b,.chief .avoid b{letter-spacing:.14em;text-transform:uppercase;font-size:10px;margin-right:6px}
  .chief .avoid{font-size:13px;color:var(--mut);margin:0 0 10px}
  .agg{color:var(--pivot);font-weight:700}
  .posbox textarea{width:100%;box-sizing:border-box;font:14px/1.5 Menlo,Consolas,monospace;padding:8px 10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
  .posbox button{font:900 12px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:var(--tag);color:var(--tagink);border:0;padding:9px 14px;margin:8px 0 10px;cursor:pointer}
  .posbox .sum{font-size:13px;color:var(--mut);margin:0 0 8px}
  .scoresum{margin:0 0 12px}
  .tabs{display:flex;gap:6px;margin:6px 0 4px}
  .tabs button{font:900 11px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--soft);color:var(--mut);padding:6px 10px;cursor:pointer}
  /* Watchlist / Alerts (Nov 5, 2026): the tabs row stays one line and scrolls sideways; » appears when buttons are hidden */
  .tabsw{position:relative}
  .tabsw .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabsw .tabs::-webkit-scrollbar{display:none}
  .tabsw .tabs button{flex:0 0 auto;white-space:nowrap}
  .tabsw.over .tabs{padding-right:40px}
  .tabsw .tmore{position:absolute;right:0;top:0;bottom:0;width:34px;font:900 16px/1 Arial,sans-serif;border:1px solid var(--soft);background:var(--bg);color:var(--ink);cursor:pointer;box-shadow:-8px 0 8px var(--bg)}
  .tabs button.act{color:var(--ink)}
  .tabs button.on2{border-color:var(--pivot);color:var(--pivot)}
  .tabs .badge{display:inline-block;min-width:14px;padding:1px 4px;margin-left:4px;background:var(--coral);color:#fff;border-radius:8px;font-size:10px;letter-spacing:0}
  .wlmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:6;min-width:240px;max-width:92vw;background:var(--bg);border:1px solid var(--rule);box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .wlrow{display:flex;border-bottom:1px solid var(--soft)}
  .wlrow button{font:700 13px/1.2 Arial,sans-serif;background:none;border:0;color:var(--ink);padding:9px 10px;cursor:pointer;text-align:left}
  .wlrow .wlt{flex:1}
  .wlrow .wlt .ck{display:inline-block;width:16px;color:var(--pivot)}
  .wlrow .wlt .n{color:var(--mut);font-weight:400;margin-left:4px}
  .wlrow .wlo{color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .wlrow.full .wlt{color:var(--mut);cursor:default}
  .wlrow.new{border-bottom:0}
  .wlrow.new button{flex:1;color:var(--pivot)}
  .wlrow .wlname{flex:1;margin:6px;font:14px Arial,sans-serif;padding:6px;border:1px solid var(--soft);background:var(--bg);color:var(--ink)}
  .alpanel{background:var(--card);padding:10px 12px;margin:4px 0 8px;font-size:13px}
  .alpanel .alr{margin:0 0 6px}
  .alpanel .alq{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
  .alpanel button,.alpush button,#al-out button,.wlblock button{font:700 12px/1 Arial,sans-serif;border:1px solid var(--soft);background:var(--bg);color:var(--ink);padding:6px 9px;cursor:pointer}
  .alpanel .alin{width:84px;font:14px Arial,sans-serif;padding:5px;border:1px solid var(--soft);background:var(--bg);color:var(--ink)}
  .alpanel .sub{margin:6px 0 0}
  .alpush{margin:8px 0 0;font-size:13px}
  .lstrip{display:flex;align-items:center;gap:10px;margin:2px 0 6px;font-size:13px;font-weight:700}
  .lstrip button{font:900 20px/1 Arial,sans-serif;border:1px solid var(--soft);background:var(--bg);color:var(--ink);width:34px;height:30px;cursor:pointer}
  .lstrip button[disabled]{opacity:.3;cursor:default}
  .alertbar{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--tag);color:var(--tagink);font:700 14px/1.4 Arial,sans-serif}
  .alertbar .abrow{max-width:860px;margin:0 auto;padding:8px 16px}
  .alertbar a{color:var(--tagink);font-weight:900}
  .alertbar .abx{float:right;background:none;border:0;color:var(--tagink);font:900 18px/1 Arial,sans-serif;cursor:pointer}
  .wlblock{margin:0 0 14px}
  .wlhead{font-size:13px;margin:6px 0 4px}
  .wlhead a{margin-left:8px;font-size:12px}
  a.wlk{text-decoration:none;border-bottom:1px dotted var(--mut)}
  .tabs button.on{background:var(--tag);color:var(--tagink);border-color:var(--tag)}
  .tabs button[disabled]{opacity:.55;cursor:wait}
  .wbtoggle{font:900 11px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink);padding:5px 9px;cursor:pointer;margin-left:8px}
  details.wbsec{margin:8px 0;border-bottom:1px solid var(--soft);padding-bottom:6px}
  details.wbsec summary{cursor:pointer;font:900 13px/1.6 "Arial Black",Impact,Arial,sans-serif;letter-spacing:.06em}
  a.secl{text-decoration:none;border-bottom:1px dotted var(--mut)}
  .arch{margin:22px 0 0;font-size:13px;line-height:1.8}
  .arch b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .arch a{text-decoration:none}
  .arch a:hover{text-decoration:underline;background:none;color:var(--ink)}
  .arch span{color:var(--mut)}
  .foot{margin-top:34px;border-top:4px double var(--rule);padding-top:12px;font-size:12px;color:var(--mut);line-height:1.7}
  .foot a{color:var(--mut)}
  .legend{font-size:12px;color:var(--mut);margin:0 0 6px}
  .theme button{font:inherit;font-size:12px;color:var(--mut);background:none;border:1px solid var(--soft);padding:4px 10px;cursor:pointer;margin-top:8px}
  @media (max-width:600px){
    body{font-size:15px}
    .mast h1{font-size:26px}
    article h2{font-size:22px}
    .board th:nth-child(n+7),.board td:nth-child(n+7){display:none}
    /* Volume Surges keeps Buy point and vs buy pt on a phone; the table scrolls sideways inside .tblwrap */
    .board.mv th:nth-child(n+7),.board.mv td:nth-child(n+7){display:table-cell}
    .board.mv{width:auto;min-width:100%}
    .board.mv th,.board.mv td{white-space:nowrap}
    .board.mv td.st{white-space:normal;min-width:120px}
    .board{font-size:12px}
  }
</style>
