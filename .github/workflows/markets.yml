name: market-desk

# The Market Desk. Five passes on NYSE trading days (weekdays minus exchange holidays), all Mountain time
# (slots and story counts live in markets.yaml desk.passes; markets.py due reads them):
#   7:15 a.m.  premarket - Premarket Movers (the broad universe's 2%+ premarket moves, in the Volume Surges columns,
#                          buy-point distance from the premarket price), index futures, and the first 3 stories.
#                          The page is dated today from here on.
#   7:45 a.m.  movers    - the first Volume Surges pass (the live screen re-runs it every minute of the session).
#  11:05 a.m.  midday    - Volume Surges, then 3 more stories from the session so far.
#   2:05 p.m.  movers    - Volume Surges with the closing numbers, five minutes after the bell. No Claude call.
#   3:20 p.m.  edition   - After Hours (same table, post-market), 4 more stories, the Desk Chief, Company of the
#                          Day, The Lesson (Fridays), the market note; on Fridays the Beehive 100 and Big Cap 40.
# The page keeps the newest 10 stories across today and yesterday; each date page keeps every story of its day.
# Prices come from Yahoo (free); Claude writes the prose from the numbers; the site is re-rendered and deployed.

on:
  schedule:
    # UTC, both seasons listed (Mountain is UTC-6 in daylight time, UTC-7 in standard time), three shots twenty
    # minutes apart per slot: GitHub drops scheduled runs outright some days (Oct 7, 2026: neither the 8:05 nor the
    # 11:05 fired). The check job runs markets.py due, which works in Mountain time and stands down any run whose
    # slot hasn't come round or has already printed, so a slot never prints twice. The cron-job.org pinger (via
    # build.yml's check job, hourly at :50, UTC 09-14 and 21-04) and the hourly siren are the real safety net;
    # these are the backup clock. Nothing pings 15:50-20:50 UTC: the 11:05 midday pass leans on these lines.
    - cron: "15,35,55 13,14 * * 1-5"   # 7:15 premarket
    - cron: "45 13 * * 1-5"            # 7:45 Volume Surges, daylight time (the next line has its other shots)
    - cron: "5,25,45 14,15 * * 1-5"    # 7:45 Volume Surges
    - cron: "5,25,45 17,18 * * 1-5"    # 11:05 midday
    - cron: "5,25,45 20,21 * * 1-5"    # 2:05 closing Volume Surges
    - cron: "20,40 21,22 * * 1-5"      # 3:20 edition
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket (7:15 table + stories), movers (Volume Surges only), midday (movers + stories), edition (the close), lists (Beehive 100 + Big Cap 40), corner (edition + The Lesson)"
        type: choice
        options: [edition, premarket, movers, midday, lists, corner]
        default: edition
      catchup:
        description: "Catch-up run (sent by build.yml or breaking.yml): stand down if the overdue pass has since printed"
        type: boolean
        default: false
      run_at:
        description: "Optional: hold this run until a UTC time today, HH:MM (e.g. 18:00 = noon Mountain in daylight time)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # A hand-dispatched run can be held until a time (run_at). The wait happens HERE, in a job that holds
  # no lock, so a held run never blocks an edition or the siren.
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Hold until run_at
        if: inputs.run_at != ''
        run: |
          target=$(date -u -d "today ${{ inputs.run_at }}" +%s)
          now=$(date -u +%s)
          if [ "$target" -gt "$now" ]; then
            echo "Holding $(( (target - now) / 60 )) minutes until ${{ inputs.run_at }} UTC."
            sleep $(( target - now ))
          fi
      - run: echo "go"

  # Should this run print at all? Scheduled runs and catch-up dispatches ask markets.py which pass, if any,
  # is overdue; if none is, the run stands down here (no prices pulled, no Claude call). A hand-run always goes.
  # Takes the build lock so it reads the artifacts AFTER any pass that is printing right now has finished.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build
      cancel-in-progress: false
    outputs:
      go: ${{ steps.due.outputs.go }}
      mode: ${{ steps.due.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                  # the branch as it is NOW, not as it was when the run was queued
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.catchup }}" != "true" ]; then
            echo "Hand-run: this run goes (mode=${{ inputs.mode }})."
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          due=$(python markets.py due)
          if [ "$due" = "none" ] || [ -z "$due" ]; then
            echo "No Market Desk pass is overdue. This run stands down."
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "The $due pass is overdue. This run goes."
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "mode=$due" >> "$GITHUB_OUTPUT"
          fi

  desk:
    needs: [hold, check]
    if: needs.check.outputs.go == 'yes'
    runs-on: ubuntu-latest
    env:
      MARKETS_ACCESS_CODES: ${{ secrets.MARKETS_ACCESS_CODES }}   # the Market Desk gate's codes (desk_gate.py)
    timeout-minutes: 50
    concurrency:
      group: build                # never races the morning/evening editions or the siren
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Which pass is this? The check job decided: the hand-run's input, or whichever pass markets.py says is overdue.
      - name: Decide the pass
        id: mode
        run: |
          mode="${{ needs.check.outputs.mode }}"
          if [ -z "$mode" ] || [ "$mode" = "none" ]; then
            # fallback by the Mountain clock: 7:15 premarket, 7:45 movers, 11:05 midday, 2:05 movers, 3:20 edition
            mt=$(TZ=America/Denver date +%H%M)
            if [ "$mt" -lt 0740 ]; then mode=premarket
            elif [ "$mt" -lt 1100 ]; then mode=movers
            elif [ "$mt" -lt 1400 ]; then mode=midday
            elif [ "$mt" -lt 1515 ]; then mode=movers
            else mode=edition; fi
          fi
          # the writer pass this mode runs: premarket / midday / close (edition and corner); none for movers and lists
          case "$mode" in
            premarket) pass=premarket ;;
            midday) pass=midday ;;
            edition|corner) pass=close ;;
            *) pass=none ;;
          esac
          friday=no; [ "$(TZ=America/Denver date +%u)" = "5" ] && friday=yes
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "friday=$friday" >> "$GITHUB_OUTPUT"
          echo "Pass: $mode (writer pass: $pass, Friday: $friday)"

      # ── Premarket Movers (7:15 am): the table, the page date, the index futures. Free.
      - name: Premarket movers
        id: premarket
        if: steps.mode.outputs.mode == 'premarket'
        continue-on-error: true
        run: python markets.py premarket

      # ── Stocks on the Move: every pass but the premarket one (no session to screen before the open). Free.
      - name: Stocks on the Move
        if: steps.mode.outputs.mode != 'premarket'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MY_SYMBOLS: ${{ secrets.MY_SYMBOLS }}
        id: movers
        continue-on-error: true
        run: python markets.py movers

      # ── The writer passes: premarket (7:15), midday (11:05), close (3:20, or by hand).
      - name: Scan the leaders
        id: scan
        if: steps.mode.outputs.pass != 'none'
        continue-on-error: true
        env:
          MARKETS_CORNER: ${{ steps.mode.outputs.mode == 'corner' && '1' || '' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MY_SYMBOLS: ${{ secrets.MY_SYMBOLS }}
        run: python markets.py scan --pass ${{ steps.mode.outputs.pass }} --out data/build/markets_payload.json

      - name: Write the articles
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "You write the Beehive Wire Market Desk. Read markets_desk.md for your standing orders, then read data/build/markets_writer.json. Write the articles to data/build/markets_articles.json as a single JSON object in exactly the schema markets_desk.md specifies. Every number must come from the payload. Write only that file. No prose, no markdown fences, no commit." \
            --model claude-opus-5-5 \
            --allowedTools "Read,Write" \
            --permission-mode acceptEdits \
            --max-turns 16 \
            < /dev/null 2>&1 | tail -c 2000

      # The desk chief: a second Opus call that ranks the day's setups by judgment (picks, avoids, the one thing to watch).
      # Once a day, at the close.
      - name: Desk chief
        if: steps.scan.outcome == 'success' && steps.mode.outputs.pass == 'close'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "You are the DESK CHIEF of the Beehive Wire Market Desk. Read the section 'The desk chief' in markets_desk.md, then read data/build/markets_writer.json. Write your verdict to data/build/markets_chief.json in exactly that schema. Every number from the payload. Write only that file. No prose, no markdown fences, no commit."             --model claude-opus-5-5             --allowedTools "Read,Write"             --permission-mode acceptEdits             --max-turns 10             < /dev/null 2>&1 | tail -c 1500

      # Every pass appends: its stories join the day's file; a name covered again replaces its earlier story.
      - name: Print the edition
        if: steps.scan.outcome == 'success'
        run: python markets.py publish --append --payload data/build/markets_payload.json --articles data/build/markets_articles.json --chief data/build/markets_chief.json

      # ── The Beehive 100 and Big Cap 40: Fridays with the edition, or by hand.
      - name: Beehive 100 and Big Cap 40
        if: steps.mode.outputs.mode == 'lists' || (steps.mode.outputs.mode == 'edition' && steps.mode.outputs.friday == 'yes')
        continue-on-error: true
        timeout-minutes: 25
        run: python markets.py lists

      - name: Render the site
        run: python build.py --render-only

      - name: Commit the desk
        run: |
          git config user.name "beehive-wire-bot"
          git config user.email "beehive-wire-bot@users.noreply.github.com"
          git add data/markets data/state.json archive
          if ! git diff --cached --quiet; then
            git commit -m "desk (${{ steps.mode.outputs.mode }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Flag a missed pass
        if: (steps.movers.outcome != 'success' && steps.movers.outcome != 'skipped') || (steps.premarket.outcome != 'success' && steps.premarket.outcome != 'skipped') || (steps.scan.outcome != 'success' && steps.scan.outcome != 'skipped')
        run: |
          echo "::error title=Market Desk pass incomplete::premarket=${{ steps.premarket.outcome }} movers=${{ steps.movers.outcome }} scan=${{ steps.scan.outcome }}. The previous page was re-rendered, not replaced."
          exit 1
