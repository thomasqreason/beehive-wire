name: market-desk

# The Market Desk. Three passes a day, weekdays, all Mountain time:
#   8:05 a.m. and 11:05 a.m. — "Stocks on the Move": the biggest volume surges, projected to the full session, with
#                              each name's chart status, so possible entries can be found before the close. No Claude call.
#   3:20 p.m.                — the full edition: stories, New America, Investor's Corner (Fridays), the final movers list,
#                              and on Fridays the Beehive 50 and Big Cap 20.
# Prices come from Yahoo (free); Claude writes the prose from the numbers; the site is re-rendered and deployed.

on:
  schedule:
    # UTC. During Mountain daylight time: 14:05 = 8:05am, 17:05 = 11:05am, 21:20 = 3:20pm.
    # GitHub drops scheduled runs outright some days (Oct 7, 2026: neither the 8:05 nor the 11:05 fired),
    # so each slot gets three shots twenty minutes apart. The check job stands the extras down once a
    # pass has printed, so a slot is never printed twice. The cron-job.org pinger (via build.yml's check
    # job) and the hourly siren are the real safety net; these are the backup clock.
    # When Mountain falls back in November, add one hour to each: "5,25,45 15", "5,25,45 18", "20,40 22".
    - cron: "5,25,45 14 * * 1-5"
    - cron: "5,25,45 17 * * 1-5"
    - cron: "20,40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "edition (full), movers (intraday list only), lists (Beehive 50 + Big Cap 20), corner (edition + Investor's Corner)"
        type: choice
        options: [edition, movers, lists, corner]
        default: edition
      catchup:
        description: "Catch-up run (sent by build.yml or breaking.yml): stand down if the overdue pass has since printed"
        type: boolean
        default: false
      run_at:
        description: "Optional: hold this run until a UTC time today, HH:MM (e.g. 18:00 = noon Mountain in daylight time)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # A hand-dispatched run can be held until a time (run_at). The wait happens HERE, in a job that holds
  # no lock, so a held run never blocks an edition or the siren.
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Hold until run_at
        if: inputs.run_at != ''
        run: |
          target=$(date -u -d "today ${{ inputs.run_at }}" +%s)
          now=$(date -u +%s)
          if [ "$target" -gt "$now" ]; then
            echo "Holding $(( (target - now) / 60 )) minutes until ${{ inputs.run_at }} UTC."
            sleep $(( target - now ))
          fi
      - run: echo "go"

  # Should this run print at all? Scheduled runs and catch-up dispatches ask markets.py which pass, if any,
  # is overdue; if none is, the run stands down here (no prices pulled, no Claude call). A hand-run always goes.
  # Takes the build lock so it reads the artifacts AFTER any pass that is printing right now has finished.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build
      cancel-in-progress: false
    outputs:
      go: ${{ steps.due.outputs.go }}
      mode: ${{ steps.due.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                  # the branch as it is NOW, not as it was when the run was queued
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.catchup }}" != "true" ]; then
            echo "Hand-run: this run goes (mode=${{ inputs.mode }})."
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          due=$(python markets.py due)
          if [ "$due" = "none" ] || [ -z "$due" ]; then
            echo "No Market Desk pass is overdue. This run stands down."
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "The $due pass is overdue. This run goes."
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "mode=$due" >> "$GITHUB_OUTPUT"
          fi

  desk:
    needs: [hold, check]
    if: needs.check.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: build                # never races the morning/evening editions or the siren
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Which pass is this? The check job decided: the hand-run's input, or whichever pass markets.py says is overdue.
      - name: Decide the pass
        id: mode
        run: |
          mode="${{ needs.check.outputs.mode }}"
          if [ -z "$mode" ] || [ "$mode" = "none" ]; then
            if [ "$(date -u +%H)" -lt 20 ]; then mode=movers; else mode=edition; fi
          fi
          friday=no; [ "$(TZ=America/Denver date +%u)" = "5" ] && friday=yes
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "friday=$friday" >> "$GITHUB_OUTPUT"
          echo "Pass: $mode (Friday: $friday)"

      # ── Stocks on the Move: every pass. Free.
      - name: Stocks on the Move
        id: movers
        continue-on-error: true
        run: python markets.py movers

      # ── The edition (3:20 pm, or by hand).
      - name: Scan the leaders
        id: scan
        if: steps.mode.outputs.mode == 'edition' || steps.mode.outputs.mode == 'corner'
        continue-on-error: true
        env:
          MARKETS_CORNER: ${{ steps.mode.outputs.mode == 'corner' && '1' || '' }}
        run: python markets.py scan --out data/build/markets_payload.json

      - name: Write the articles
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "You write the Beehive Wire Market Desk. Read markets_desk.md for your standing orders, then read data/build/markets_writer.json. Write the articles to data/build/markets_articles.json as a single JSON object in exactly the schema markets_desk.md specifies. Every number must come from the payload. Write only that file. No prose, no markdown fences, no commit." \
            --model claude-opus-5-5 \
            --allowedTools "Read,Write" \
            --permission-mode acceptEdits \
            --max-turns 16 \
            < /dev/null 2>&1 | tail -c 2000

      - name: Print the edition
        if: steps.scan.outcome == 'success'
        run: python markets.py publish --payload data/build/markets_payload.json --articles data/build/markets_articles.json

      # ── The Beehive 50 and Big Cap 20: Fridays with the edition, or by hand.
      - name: Beehive 50 and Big Cap 20
        if: steps.mode.outputs.mode == 'lists' || (steps.mode.outputs.mode == 'edition' && steps.mode.outputs.friday == 'yes')
        continue-on-error: true
        timeout-minutes: 25
        run: python markets.py lists

      - name: Render the site
        run: python build.py --render-only

      - name: Commit the desk
        run: |
          git config user.name "beehive-wire-bot"
          git config user.email "beehive-wire-bot@users.noreply.github.com"
          git add data/markets data/state.json archive
          if ! git diff --cached --quiet; then
            git commit -m "desk (${{ steps.mode.outputs.mode }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Flag a missed pass
        if: steps.movers.outcome != 'success' || (steps.scan.outcome != 'success' && steps.scan.outcome != 'skipped')
        run: |
          echo "::error title=Market Desk pass incomplete::movers=${{ steps.movers.outcome }} scan=${{ steps.scan.outcome }}. The previous page was re-rendered, not replaced."
          exit 1
