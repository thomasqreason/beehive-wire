# Write headlines between editions, so the deadline call spends its budget on judgment.
#
# Deliberately NOT in the shared `build` concurrency group. build.yml, breaking.yml and markets.yml
# share it so two jobs never deploy Pages at once — but this job deploys nothing. Putting it in
# that group is exactly how the Oct 8, 2026 outage happened: hour-long runs held the lock and the
# Market Desk sat Pending all morning. It gets its own group and a hard 15-minute ceiling.
name: prewrite

on:
  schedule:
    # Every three hours, off the hour. 09:37 and 21:37 UTC land about an hour before the morning
    # and evening editions, so the last batch before a deadline is the freshest one. Dial this
    # down first if the editions start colliding with Todd's own Claude usage.
    - cron: "37 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

concurrency:
  group: prewrite
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Write headlines for what has arrived
        continue-on-error: true        # no headlines this hour is a non-event; the editor writes its own
        timeout-minutes: 13
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          python prewrite.py

      - name: Commit the headline cache
        run: |
          git config user.name "beehive-wire-bot"
          git config user.email "beehive-wire-bot@users.noreply.github.com"
          git add data/headlines.json data/dates.json
          if ! git diff --cached --quiet; then
            git commit -m "prewrite: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Pull FIRST, then push: a rebase over our own staged change is what left conflict
            # markers in the tree on Oct 8, 2026.
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
          else
            echo "No new headlines."
          fi
