name: video

# Makes and uploads the YouTube video for the edition that just printed, to the Boring Money channel.
#
#   build (workflow_run) -> due? -> payload -> Claude writes the narration -> render -> upload -> record
#
# Triggers: the build workflow finishing (the normal path), a backup clock twice a day, and a hand-run.
# The backup clock exists because GitHub drops and delays scheduled runs. Every path asks `video.py due`
# first, which looks in data/video/published.json for the edition's date and slot, so an edition is never
# uploaded twice and an old one is never backfilled.
#
# Secrets (Settings > Secrets and variables > Actions): CLAUDE_CODE_OAUTH_TOKEN (already used by build.yml),
# YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN. See README, "The YouTube video".

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  schedule:
    # The cron: twice a day, three shots each, UTC. Editions land at 10:00 and 22:00 UTC (Mountain daylight)
    # and a build takes ~20 minutes, so the first shot of each trio is just after the edition is up and the
    # other two catch a late build or a dropped run (GitHub delays and drops scheduled runs). Extra shots cost
    # nothing: `due` decides by edition, not by the hour, so an edition is only ever made once and daylight
    # saving needs no edit.
    - cron: "10,50 11 * * *"      # morning edition
    - cron: "30 12 * * *"
    - cron: "10,50 23 * * *"      # evening edition
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Make a video even if this edition already has one (uploads a duplicate)"
        type: boolean
        default: false
      dry_run:
        description: "Render only: build the video and keep it as a run artifact, no upload"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write                 # the publish job below puts the finished video on the front page
  id-token: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    # A build that failed outright printed nothing new; its last edition already has (or had) its video.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      uploaded: ${{ steps.record.outputs.uploaded }}
      key: ${{ steps.due.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                    # the branch as it is NOW, with the edition the build just committed
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Until the YouTube secrets exist, `due` answers no and the run ends quietly instead of failing every day.
      - id: due
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python video.py due ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Install ffmpeg and a backup voice
        if: steps.due.outputs.go == 'yes'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-liberation

      # Kokoro's model files are about 350 MB; video.py fetches them when this cache is cold.
      - name: Keep the voice model between runs
        if: steps.due.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0

      - name: Pick the stories
        if: steps.due.outputs.go == 'yes'
        run: python video.py --emit-payload data/video/payload.json

      # Claude reads video_editorial.md and writes the narration. Same CLI call as build.yml's editor.
      # If it fails, `render --fallback` below reads the headlines straight, so the slot still gets a video.
      - name: Write the script
        if: steps.due.outputs.go == 'yes'
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          # The writer sometimes burns every turn without writing the file, so it gets three tries, and each
          # try reports which tools it reached for (the log of a failed run used to say nothing).
          for attempt in 1 2 3; do
            rm -f data/video/script.json
            claude -p "You write the narration for the Beehive Wire video. Read video_editorial.md for your standing orders, then read data/video/payload.json. Write the script to data/video/script.json as a single JSON object in exactly the schema video_editorial.md specifies. You have exactly two tools, Read and Write: do not reach for any other, do not count words with a tool, and do not re-read or rewrite your file. Two reads, one Write, then stop. No prose, no markdown fences, no commit." \
              --model claude-sonnet-5 \
              --effort medium \
              --allowedTools "Read,Write" \
              --permission-mode acceptEdits \
              --max-turns 30 \
              --output-format stream-json --verbose \
              < /dev/null > data/video/editor.log 2>&1 || true
            echo "attempt $attempt tools: $(grep -o '"type":"tool_use","id":"[^"]*","name":"[A-Za-z_]*"' data/video/editor.log | sed 's/.*"name"://' | sort | uniq -c | tr '\n' ' ')"
            tail -c 400 data/video/editor.log | cut -c1-400; echo
            [ -s data/video/script.json ] && break
          done
          [ -s data/video/script.json ]

      - name: Render the video
        if: steps.due.outputs.go == 'yes'
        run: |
          if [ -s data/video/script.json ]; then
            python video.py render
          elif [ "${{ inputs.force }}" = "true" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            # A remake replaces a video that is already up; a bare headline read is not an improvement on it.
            echo "No script from Claude. A remake needs a full script, so nothing is replaced."
            exit 1
          else
            echo "No script from Claude -- reading the headlines straight."
            python video.py render --fallback
          fi

      - name: Keep the render (dry run)
        if: steps.due.outputs.go == 'yes' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.due.outputs.key }}
          path: data/video/out/
          retention-days: 7

      - name: Upload to YouTube
        if: steps.due.outputs.go == 'yes' && !inputs.dry_run
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python video.py upload ${{ inputs.force && '--force' || '' }}

      - name: Record the upload
        id: record
        if: steps.due.outputs.go == 'yes' && !inputs.dry_run
        run: |
          git config user.name "beehive-wire-bot"
          git config user.email "beehive-wire-bot@users.noreply.github.com"
          git add data/video/published.json
          if ! git diff --cached --quiet; then
            git commit -m "video: ${{ steps.due.outputs.key }}"
            git pull --rebase --autostash origin main
            git push
            echo "uploaded=yes" >> "$GITHUB_OUTPUT"
          fi

  # Put the video on beehivewire.com, right after it goes up on YouTube.
  #
  # Why a job of its own: the front page is deployed by build.yml, breaking.yml and markets.yml, which all
  # share `concurrency: group: build` so two of them never push Pages at once. This job joins that group, so
  # it queues politely behind an edition instead of racing it -- but the hour-long video job above must NOT
  # hold that lock (that is what starved the Market Desk on Oct 8), so only this two-minute job is in it.
  #
  # There is no Claude call and no new edition here: build.py --render-only re-renders the edition already in
  # data/state.json, and build.py now finds the video by its edition key in data/video/published.json. If a new
  # edition happened to print while the video was rendering, the key no longer matches and the page simply
  # comes out without it -- which is right: that video belongs to the edition before.
  #
  # A pushed commit cannot do this itself: pushes made with GITHUB_TOKEN never trigger another workflow, and
  # build.yml's push trigger ignores data/** anyway.
  publish:
    needs: video
    if: needs.video.outputs.uploaded == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                    # includes the published.json commit the job above just pushed
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Put the video on the front page
        run: python build.py --render-only
      - name: Commit the re-rendered archive copy
        run: |
          git config user.name "beehive-wire-bot"
          git config user.email "beehive-wire-bot@users.noreply.github.com"
          git add data/shelf.json archive
          if ! git diff --cached --quiet; then
            git commit -m "video on page: ${{ needs.video.outputs.key }}"
            git pull --rebase --autostash origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
