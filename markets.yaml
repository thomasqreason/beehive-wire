# Beehive Wire — Market Desk configuration.
# The desk writes 5–10 breakout-method stock articles a day about the names below. Edit this list freely:
# one ticker per line, Yahoo Finance symbols. Names with no price data are skipped automatically.

desk:
  name: "MARKET DESK"
  tagline: "Leaders, bases and breakouts. Numbers first."
  timezone: "America/Denver"
  stories_min: 5
  stories_max: 10
  chart_bars: 130                  # daily bars drawn on each article's chart
  board_rows: 40                   # rows on the leaders board (sorted by RS)
  buy_zone_pct: 5                  # buy point to 5% above it
  breakout_volume_ratio: 1.2       # informational only since Oct 24, 2026: volume is shown everywhere, required nowhere
  history_period: "2y"
  # Live prices in the chart pop-up: the Cloudflare Worker in relay/quote-worker.js. Leave empty to turn it off.
  quote_relay: "https://beehive-quotes.toddridgway.workers.dev/"
  # The gate (Oct 30, 2026): the desk is for readers with a code. Every desk page is published encrypted
  # (desk_gate.py); the codes are the MARKETS_ACCESS_CODES repository secret, issued by Todd and nobody
  # else. The gate page lets a visitor leave an email, which opens a request to request_email.
  gate:
    enabled: true
    request_email: "toddridgway@gmail.com"   # where "Request a code" sends the visitor's email. Change freely.
    # Paid access (Oct 30, 2026): a Stripe Payment Link. After paying, Stripe sends the buyer to
    # https://beehivewire.com/markets/welcome/?session_id={CHECKOUT_SESSION_ID}, which shows their code.
    # Leave payment_link empty to hide the Subscribe button. Codes are kept by the relay (relay/README.md).
    payment_link: "https://buy.stripe.com/4gM4gB2U6bqQdbM2Dy4Ja02"
    price_label: "$9.99 for your first 21 days, then $49.99 a month"   # shown with the Subscribe button (Todd, Oct 30, 2026)
    video_id: ""                             # the promo's YouTube id (promo.py / Actions -> promo); shows it on the gate page

