# Beehive Wire — Market Desk configuration.
# The desk writes 5–10 IBD-style stock articles a day about the names below. Edit this list freely:
# one ticker per line, Yahoo Finance symbols. Names with no price data are skipped automatically.

desk:
  name: "MARKET DESK"
  tagline: "Leaders, bases and breakouts. Numbers first."
  timezone: "America/Denver"
  stories_min: 5
  stories_max: 10
  chart_bars: 130                  # daily bars drawn on each article's chart
  board_rows: 40                   # rows on the leaders board (sorted by RS)
  buy_zone_pct: 5                  # IBD: buy point to 5% above it
  breakout_volume_ratio: 1.2       # volume vs 50-day average that counts as conviction
  history_period: "2y"

# The watch list: big companies and the names most likely to lead the next leg.
