# The Lesson topics, in rotation (one each Friday, or any run with MARKETS_CORNER=1).
# Each is written against a real chart from that day's edition.
corner_topics:
  - "How to buy a breakout: the buy point, the 5% buy range, and what the volume tells you (and what it no longer proves)"
  - "The 7-8% sell rule: why every position starts with a stop and how to set it from the buy point"
  - "Reading a cup with handle: depth, length, the handle's shakeout, and where the buy point sits"
  - "Relative strength: what the RS line against the S&P 500 tells you before the price does"
  - "Extended stocks: why chasing 10% past a buy point costs you, and what the next entry looks like"
  - "The 21-day and 50-day lines: using them for add-on buys, for holding, and for selling"
  - "IPO bases: why new issues can be bought from short bases and what makes them fail"
  - "Distribution days and the market note: how to size positions by the market's state"
  - "Flat bases and three-weeks-tight: the quiet patterns that mark institutional accumulation"
  - "Earnings season: handling a stock you own into its report, and buying after a gap-up"
  - "The 20-25% profit rule and when to let a winner run past it"
  - "Climax tops: the signs a leader's run is ending"

# Volume Surges (8am / 11am Mountain runs, and again after the close). Qualifiers:
movers:
  min_price: 10              # dollars
  min_avg_volume: 400000     # 50-day average shares/day
  min_volume_ratio: 1.5      # today's volume (projected to the full session while the market is open) vs the 50-day average
  min_up_pct: 1.0            # up at least this much on the day for the UP list (down at least this much for the DOWN list)
  min_rs_rank: 70            # RS rank, measured against the desk list's distribution
  rows_up: 20
  rows_down: 10

# The Beehive 100 (growth leaders) and the Big Cap 40 — refreshed after Friday's close.
# Composite = 40% RS rank + 25% latest-quarter EPS growth (capped at 200%) + 10% revenue growth (capped 100%)
#           + 25% chart (above 50-day, above 200-day, within 15% of the 52-week high, in a buyable pattern; bonuses for an RS-line high and EPS acceleration)
leaders:
  list_size: 100                  # names on the Beehive list (the table's title follows this number). 50 -> 100 on Oct 29, 2026: the page skims fast; the 50 was a print-era limit
  big_cap_size: 40                # names on the Big Cap list (20 -> 40 on Oct 29, 2026)
  min_price: 15
  min_dollar_volume: 20000000     # close x 50-day average volume
  min_eps_growth: 15              # a name needs EPS growth >= this OR revenue growth >= min_rev_growth to make the list
  min_rev_growth: 20
  big_cap_min: 40000000000        # $40B market cap for the Big Cap 40 (no growth floor: the composite sorts them).
                                  # Todd, Oct 29, 2026: the list is ALWAYS 40 names; if the strongest 220 hold fewer, leader_lists()
                                  # keeps walking down the universe by RS until it has 40 over the floor.
  fundamentals_pool: 220          # fundamentals fetched for this many of the strongest names by RS (cached 7 days)
