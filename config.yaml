# How the 100 links should roughly break down. These are targets the editor aims for, not hard caps.
# Positive stories are not a topic — every beat is expected to carry its own (see editorial.md).
mix:
  iran_mideast: 3                 # 6 -> 3 on Oct 13, 2026: the page was putting far too many headlines on the wars
  ukraine_russia: 2               # 4 -> 2 on Oct 13, 2026 (same reason)
  world: 4                        # 5 -> 4 on Oct 8, 2026 (mix retuned to 100 after investing was added)
  immigration: 2                  # HARD CAP: max 2 ICE/illegal-immigration links on the page (see editorial.md)
  crime: 5
  trump_watch: 5
  elections: 5
  politics_culture_world: 4       # Washington and the culture war (5 -> 4, Oct 8, 2026)
  media: 2
  faith_family_schools: 4
  military: 2                     # 3 -> 2 on Oct 13, 2026 (same reason)
  business_ai: 6                  # AI and the data-center controversies, one beat
  tech: 4
  surveillance: 3               # the surveillance state and civil liberties — added Sep 18, 2026
  american_life: 6              # how Americans actually live — added Sep 18, 2026; 5 -> 6 on Oct 13
  economy: 6                      # 7 -> 6 on Oct 8, 2026; investing has its own line now
  investing: 4                  # stocks and investing, 3-5 links every edition; the Market Desk's own pieces count (added Oct 5, 2026)
  energy: 3
  housing: 3
  health: 4                       # 5 -> 4 on Oct 8, 2026
  utah_mormon: 4
  sports: 4
  pop_culture: 4                  # 3 -> 4 on Oct 13, 2026: big-star news earns its slots
  weather_disasters: 2
  weird: 6                        # 2 -> 6 on Oct 13, 2026: the odd-corner tail is what makes the page scrollable
  video: 3                        # WATCH: links — PJW, Tucker, Candace and the like, clustered at the foot

# The YouTube video (video.py, .github/workflows/video.yml): a few minutes on each edition's top stories,
# posted after the morning and evening editions print.
video:
  channel_name: "Beehive Wire"     # what the intro card and the narrator call the show (the YouTube channel is BoringMoney)
  expect_channel: "boringmoney"    # upload refuses unless the credentials belong to a channel whose name contains this
  stories: 14                      # top story + flash lines + the page's next links, at most two per topic
  target_words: [1350, 1650]       # narration length Claude aims for: about 9 to 11 minutes at the voice's pace
  max_edition_age_hours: 10        # a slot that was missed is skipped, not backfilled with a stale video
  privacy: "public"                # public | unlisted | private. Google honors this. Todd's standing order
                                   # (2026-10-12): always public by default
  category_id: 25                  # 25 = News & Politics
  synthetic_disclosure: false      # true sets YouTube's "altered or synthetic content" label
  tts: "kokoro"                    # kokoro (neural, runs on the runner, the voice Todd picked) | edge (free
                                   # Microsoft voices; blocked since 2026-10-12) | espeak (robotic, last resort)
  kokoro_voice: "af_heart"
  kokoro_speed: 1.05
  # Spoken word for word after the writer's outro, on every video. Todd's wording (2026-10-12).
  signoff: "Like, subscribe, and be sure to ring the bell to get notified. Every story in this video, and the link to the site, are in the description below. The whole front page is waiting for you at beehivewire dot com, with a new edition every morning at 6 AM Eastern and every evening at 6 PM."
  say_as:                       # words Kokoro mispronounces -> a spelling it reads right. Whole words, case-sensitive.
    Houthis: "Hoothees"            # Add a line here whenever Todd hears a wrong one.
    Houthi: "Hoothee"
    beehivewire: "beehive wire"    # it read the one-word site name as "bee-hiv-wire"
    ICE: "Ice"
    GOP: "G O P"
    Xi: "Shee"
    Putin: "Pootin"
    MAGA: "Magga"
    Kyiv: "Keev"
    Riyadh: "Reeyahd"
    Zelenskyy: "Zelensky"
  voice: "en-US-AndrewNeural"      # edge-tts voice, used only if Kokoro fails
  rate: "+5%"
  pad_seconds: 0.7
  watermark: "beehivewire.com"
  show_on_site: true            # put the finished video on the front page of beehivewire.com, under the
                                # giant headline, as soon as it is up on YouTube. Set false to stop that
                                # without touching the upload.
  tags: ["news", "headlines", "Beehive Wire", "beehivewire.com", "daily news"]
