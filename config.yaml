# Beehive Wire — site configuration
# Everything the editor (build.py) needs that isn't the feed list or the editorial voice.

site:
  name: "BEEHIVE WIRE"
  tagline: "Morning and evening. Nothing in between."
  editions:                        # local (Mountain) times the two editions land
    morning: "04:00"                 # = 6:00 a.m. Eastern
    evening: "16:00"                 # = 6:00 p.m. Eastern
  reader_timezone: "America/New_York"   # 80% of US readers are Eastern or Central...
  reader_tz_label: "Eastern"            # ...so the sign-off quotes their clock
  domain: "beehivewire.com"        # writes site/CNAME so GitHub Pages serves the custom domain
  timezone: "America/Denver"       # timestamp shown on the page
  open_links_in_new_tab: true

page:
  total_links: 100                 # top + flash + column links. The editor keeps the page at this size. (100 from Sep 16, 2026; was 50, then 75.)
  flash_lines: 3                   # small lines above the giant headline (0-4)
  columns: 1                       # one column, single file — not the three-column Drudge grid

# Tuned for TWO builds a day (morning and late afternoon). If you move to a faster
# cadence, drop max_swaps_per_run to ~4 and max_story_age_hours to ~36.
rolling:
  max_swaps_per_run: 50            # HARD RULE (Oct 7, 2026): exactly fifty new and fifty held over, every edition
  max_story_age_hours: 60          # a story can live across ~5 builds before it is dropped
  top_story_max_age_hours: 16      # the giant headline is re-picked every build
  candidate_window_hours: 26       # double-covers the ~12h gap, so a skipped run loses nothing
  max_candidates: 280              # a bigger pool, since there are only two chances a day to pick (and 100 slots to fill)
  max_per_source: 6                # per-feed cap inside the candidate list
  quiet_hours:                     # pointless on a twice-daily schedule; left here if you speed up
    start: 1
    end: 5
    enabled: false

editor:
  model: "claude-sonnet-5"         # cheapest model that writes a genuinely good headline; or claude-haiku-4-5-20251001
  max_tokens: 12000
  temperature: 0.7
  retries: 2

fetch:
  timeout_seconds: 12
  workers: 12
  user_agent: "Mozilla/5.0 (compatible; BeehiveWire/1.0; +https://github.com/)"

# Stories dropped before the editor ever sees them. Matched against the candidate's source name,
# case-insensitively, as a substring (so "krem.com" matches "www.krem.com" but not "KREM").
blocklist:
  sources: []                      # never run a story from these outlets, on any beat
  by_topic:
    # The "Locked On" podcasts are syndicated as /video/ pages on every TEGNA station site, and
    # Google News hands them over labelled with the station's bare domain as if they were that
    # station's reporting. On a sports feed, one of these domains is a podcast episode, not news.
    # (Oct 1, 2026: a Locked On Utes episode title ran as UTAH UPSETS MICHIGAN... — no such game.)
    sports:
      - 10tv.com
      - 11alive.com
      - 12news.com
      - 13newsnow.com
